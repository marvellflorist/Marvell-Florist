<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting…</title>
<script>
const params = new URLSearchParams(window.location.search);
const slug = params.get("story") || params.get("journal") || "";
const target = slug ? `journal?journal=${encodeURIComponent(slug)}` : "journal";
window.location.replace(target);
</script>
</head>
<body>
<p><a id="story-redirect-link" href="journal">Continue to Journal</a></p>
<script>
const link = document.getElementById("story-redirect-link");
if (link instanceof HTMLAnchorElement) {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get("story") || params.get("journal") || "";
  link.href = slug ? `journal?journal=${encodeURIComponent(slug)}` : "journal";
}
</script>
</body>
</html>
