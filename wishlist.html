<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="description" content="The pieces you have saved, kept together and yours to arrange.">

<link rel="icon" href="/assets/logo.webp?v=4" type="image/webp" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/logo.webp?v=4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Inter Tight", sans-serif;
  color: #2f2923;
  background: #fff;
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; }
.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

:root { --header-height: 72px; }
body > header {
  position: fixed; top: 0; left: 0; width: 100%;
  z-index: 80; height: var(--header-height);
  padding: 0 18px; display: flex; align-items: center;
  pointer-events: none;
}
body > header::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: var(--header-height); background: #fff; z-index: 1;
}
body > header, body > header::before { border: 0 !important; box-shadow: none !important; }
.header-bar {
  position: relative; width: 100%; height: var(--header-height);
  display: flex; align-items: center; gap: 14px; z-index: 2; pointer-events: auto;
}

/* The wishlist itself lives in assets/wishlist.css, which the account
   page loads too, so the room is the same in both places. Only the
   shell of this page is above. */
</style>
</head>
<body class="shop-page">
<header>
  <div class="header-bar">
    <a class="header-contact" href="https://wa.me/6281275017456" target="_blank" rel="noopener noreferrer">Contact Us</a>
    <a class="header-logo" href="index.html" aria-label="Marvell Florist home">
      <span class="header-logo-text">MARVELL FLORIST</span>
    </a>
    <a class="search-toggle" href="gallery.html?entry=home-hero" aria-label="Browse arrangements">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <span class="search-label">Search</span>
    </a>
    <button class="menu-toggle" id="menu-toggle" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="menu-panel">
      <span class="menu-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg>
      </span>
      <span class="menu-label">Menu</span>
    </button>
  </div>
</header>

<nav class="wl-account-nav" aria-label="Account" data-wl-account-nav hidden>
  <a href="/account">Overview</a>
  <a href="/account?tab=orders">Orders</a>
  <a href="/wishlist" aria-current="page">Wishlist</a>
  <a href="/account?tab=profile">Personal details</a>
  <a href="/account?tab=preferences">Preferences</a>
  <button type="button" data-wl-signout>Sign out</button>
</nav>

<main class="wl-main" id="wishlist-main">
  <h1 class="sr-only">Your wishlist</h1>

  <!-- All of a customer's lists. Never shown to a signed-out visitor, who
       has one list and nothing to choose between. -->
  <section class="wl-view wl-layout" data-wl-view="index" hidden>
    <aside class="wl-aside">
      <h2 class="wl-heading">Your wishlists<span class="wl-tally" data-wl-tally></span></h2>
      <!-- A new list is made, not filled in. It arrives as "Wishlist 2" and is
           renamed from its own Options menu if the customer wants it named. -->
      <button class="wl-primary" type="button" data-wl-create></button>
      <p class="wl-note" data-wl-note hidden></p>
    </aside>
    <div class="wl-body">
      <ul class="wl-lists" data-wl-lists></ul>
    </div>
  </section>

  <!-- One list, or the whole of a signed-out visitor's wishlist. -->
  <section class="wl-view wl-layout" data-wl-view="detail" hidden>
    <aside class="wl-aside">
      <div class="wl-aside-top" data-wl-detail-top>
        <a class="wl-back" href="/wishlist" data-wl-back>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
          <span data-wl-back-label></span>
        </a>
        <div class="wl-menu" data-wl-detail-menu data-open="false">
          <button class="wl-menu-trigger" type="button" aria-haspopup="true" aria-expanded="false" data-wl-detail-menu-trigger></button>
          <ul class="wl-menu-list" data-wl-detail-menu-list></ul>
        </div>
      </div>
      <div class="wl-title-slot">
        <h2 class="wl-heading" data-wl-detail-name></h2>
        <form class="wl-name-form" data-wl-rename-form hidden>
          <input type="text" maxlength="80" data-wl-rename-input aria-label="List name">
          <div class="wl-name-actions">
            <button class="wl-primary" type="submit" data-wl-rename-save></button>
            <button class="wl-linkish" type="button" data-wl-rename-cancel></button>
          </div>
        </form>
      </div>
      <p class="wl-sub" data-wl-detail-sub hidden></p>

      <button class="wl-primary" type="button" data-wl-create-from-detail data-wl-detail-create hidden>Create a new wishlist</button>

      <div class="wl-share" data-wl-share hidden>
        <label class="wl-share-row">
          <input type="checkbox" data-wl-share-input>
          <span data-wl-share-label></span>
        </label>
        <p class="wl-share-note" data-wl-share-note></p>
      </div>

      <p class="wl-note" data-wl-detail-note hidden></p>
    </aside>
    <div class="wl-body">
      <ul class="shop-grid wl-grid" data-wl-items></ul>
      <div class="wl-empty" data-wl-empty hidden></div>
      <p class="wl-foot" data-wl-foot hidden></p>
    </div>
  </section>
</main>

<script src="/assets/newsletter.js?v=20261007a"></script>
<script src="assets/shared-contact.js?v=20260921f"></script>
<script src="assets/purchase-mode.js?v=20260921a"></script>
<script src="assets/favorites.js?v=20260923a"></script>
<script src="/assets/bag.js?v=20260921c"></script>
<script src="/assets/account.js?v=20260923a"></script>
<script src="assets/wishlist-page.js?v=20260923b"></script>
<script src="assets/secondary-menu.js?v=20260923a"></script>
<script src="assets/shared-footer.js?v=20260923c"></script>
</body>
</html>
