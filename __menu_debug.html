<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Debug</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #e9e5dc;
    }
    iframe {
      width: 1440px;
      height: 1200px;
      border: 0;
      display: block;
      margin: 0 auto;
      background: white;
    }
    pre {
      margin: 0;
      padding: 12px 16px;
      white-space: pre-wrap;
      background: rgba(255,255,255,0.9);
      border-top: 1px solid rgba(0,0,0,0.08);
      font-size: 12px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <iframe id="app"></iframe>
  <pre id="log">waiting...</pre>
  <script>
    const frame = document.getElementById("app");
    const log = document.getElementById("log");
    const baseHref = `${window.location.origin}${window.location.pathname.replace(/[^/]*$/, "")}`;

    function rectData(node) {
      if (!(node instanceof HTMLElement)) return null;
      const rect = node.getBoundingClientRect();
      return {
        left: Math.round(rect.left),
        top: Math.round(rect.top),
        width: Math.round(rect.width),
        height: Math.round(rect.height),
        right: Math.round(rect.right),
        bottom: Math.round(rect.bottom)
      };
    }

    function wait(ms) {
      return new Promise((resolve) => window.setTimeout(resolve, ms));
    }

    async function findElement(doc, selector, timeout = 6000) {
      const started = Date.now();
      while (Date.now() - started < timeout) {
        const node = doc.querySelector(selector);
        if (node instanceof HTMLElement) return node;
        await wait(120);
      }
      return null;
    }

    async function run() {
      const doc = frame.contentDocument;
      const win = frame.contentWindow;
      if (!doc || !win) {
        log.textContent = "no iframe doc";
        return;
      }

      await wait(1600);

      const menuToggle = await findElement(doc, ".menu-toggle", 12000);
      if (!(menuToggle instanceof HTMLElement)) {
        log.textContent = "no menu toggle";
        return;
      }
      menuToggle.click();
      await wait(700);

      const servicesTrigger = await findElement(doc, '[data-menu-quick="services"]');
      if (!(servicesTrigger instanceof HTMLElement)) {
        log.textContent = "no services trigger";
        return;
      }
      servicesTrigger.click();
      await wait(500);

      const menuPanel = doc.getElementById("menu-panel");
      const quickPane = doc.querySelector("[data-menu-quickpane]");
      const quickCurrent = quickPane instanceof HTMLElement ? quickPane.getAttribute("data-quick-current") : "";
      log.textContent = JSON.stringify({
        menuPanel: rectData(menuPanel),
        quickPane: rectData(quickPane),
        quickCurrent,
        viewport: { width: win.innerWidth, height: win.innerHeight }
      }, null, 2);
    }

    async function bootstrap() {
      const response = await fetch("about.html", { cache: "no-store" });
      const html = await response.text();
      const withBase = html.includes("<head>")
        ? html.replace("<head>", `<head><base href="${baseHref}">`)
        : `<base href="${baseHref}">${html}`;
      frame.addEventListener("load", () => {
        run().catch((error) => {
          log.textContent = String(error && error.stack || error);
        });
      }, { once: true });
      frame.srcdoc = withBase;
    }

    bootstrap().catch((error) => {
      log.textContent = String(error && error.stack || error);
    });
  </script>
</body>
</html>
