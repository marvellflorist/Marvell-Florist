<script>
function getEmbeddedJsonPayload(scriptId) {
  const element = document.getElementById(scriptId);
  if (!(element instanceof HTMLScriptElement)) return null;
  const raw = String(element.textContent || "").trim();
  if (!raw) return null;
  try {
    return JSON.parse(raw);
  } catch (_error) {
    return null;
  }
}

function buildStoriesEndpoints() {
  const stamp = Date.now();
  return [
    `/content/stories.json?v=${stamp}`,
    `content/stories.json?v=${stamp}`,
    "/content/stories.json",
    "content/stories.json"
  ];
}

function normalizeStoryImage(entry) {
  if (!entry) return "";
  if (typeof entry === "string") return entry.trim();
  if (typeof entry === "object" && typeof entry.image === "string") return entry.image.trim();
  return "";
}

function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function escapeAttr(value) {
  return escapeHTML(value);
}

async function fetchStoriesPayload() {
  for (const endpoint of buildStoriesEndpoints()) {
    try {
      const response = await fetch(endpoint, { cache: "no-store" });
      if (!response.ok) continue;
      return await response.json();
    } catch (_error) {
    }
  }
  return getEmbeddedJsonPayload("embedded-stories-json");
}

function normalizeStoriesEntries(payload) {
  const entries = Array.isArray(payload?.entries) ? payload.entries : [];
  return entries.map((entry, index) => {
    const slug = String(entry?.slug || "").trim() || `story-${index + 1}`;
    const title = String(entry?.title || "").trim() || `Journal ${index + 1}`;
    const monthYear = String(entry?.monthYear || "").trim();
    const coverImage = normalizeStoryImage(entry?.coverImage);
    const images = Array.isArray(entry?.images) ? entry.images.map(normalizeStoryImage).filter(Boolean) : [];
    return {
      slug,
      title,
      monthYear,
      coverImage: coverImage || images[0] || "",
      images: images.length ? images : (coverImage ? [coverImage] : [])
    };
  });
}

function setStoryMeta(title, image) {
  document.title = `${title} | Marvell Florist`;
  const ogTitle = document.querySelector('meta[property="og:title"]');
  const twitterTitle = document.querySelector('meta[name="twitter:title"]');
  const ogImage = document.querySelector('meta[property="og:image"]');
  const twitterImage = document.querySelector('meta[name="twitter:image"]');
  if (ogTitle) ogTitle.setAttribute("content", `${title} | Marvell Florist`);
  if (twitterTitle) twitterTitle.setAttribute("content", `${title} | Marvell Florist`);
  if (image && ogImage) ogImage.setAttribute("content", new URL(image, window.location.origin).href);
  if (image && twitterImage) twitterImage.setAttribute("content", new URL(image, window.location.origin).href);
}

function renderRelatedJournals(entries, currentSlug) {
  const section = document.getElementById("related-journals");
  const grid = document.getElementById("related-journals-grid");
  if (!(section instanceof HTMLElement) || !(grid instanceof HTMLElement)) return;

  const related = entries
    .filter((item) => item && item.slug !== currentSlug && item.coverImage)
    .slice(0, 2);

  if (!related.length) {
    section.hidden = true;
    grid.innerHTML = "";
    return;
  }

  section.hidden = false;
  grid.innerHTML = related.map((entry) => `
    <a class="related-journal-card" href="journal.html?journal=${encodeURIComponent(entry.slug)}" aria-label="${escapeAttr(entry.title)}">
      <div class="related-journal-media">
        <img src="${escapeAttr(entry.coverImage)}" alt="${escapeAttr(entry.title)}" loading="lazy" decoding="async">
      </div>
      <p class="related-journal-name">${escapeHTML(entry.title)}</p>
      ${entry.monthYear ? `<p class="related-journal-meta">${escapeHTML(entry.monthYear)}</p>` : ""}
    </a>
  `).join("");
}

function setupDesktopStoryScroll() {
  const section = document.getElementById("story-scroll-section");
  const sticky = document.getElementById("story-scroll-sticky");
  const track = document.getElementById("story-track");
  if (!(section instanceof HTMLElement) || !(sticky instanceof HTMLElement) || !(track instanceof HTMLElement)) return;

  const sync = () => {
    const maxOffset = Math.max(0, track.scrollWidth - sticky.clientWidth);
    const stickyHeight = sticky.offsetHeight;
    section.style.height = `${stickyHeight + maxOffset + 80}px`;
    const rect = section.getBoundingClientRect();
    const progress = Math.max(0, Math.min(maxOffset, -rect.top));
    track.style.transform = `translate3d(${-progress}px, 0, 0)`;
  };

  window.addEventListener("scroll", sync, { passive: true });
  window.addEventListener("resize", sync, { passive: true });
  window.addEventListener("load", sync);
  requestAnimationFrame(sync);
}

(async () => {
  const payload = await fetchStoriesPayload();
  const entries = normalizeStoriesEntries(payload || {});
  const titleNode = document.getElementById("story-title");
  const metaNode = document.getElementById("story-meta");
  const section = document.getElementById("story-scroll-section");
  const track = document.getElementById("story-track");
  const emptyState = document.getElementById("story-empty");
  if (!(titleNode instanceof HTMLElement) || !(metaNode instanceof HTMLElement) || !(section instanceof HTMLElement) || !(track instanceof HTMLElement) || !(emptyState instanceof HTMLElement)) return;

  const slug = String(new URL(window.location.href).searchParams.get("journal") || "").trim();
  const entry = entries.find((item) => item.slug === slug) || entries[0] || null;
  if (!entry) {
    emptyState.hidden = false;
    emptyState.style.display = "grid";
    return;
  }

  emptyState.hidden = true;
  emptyState.style.display = "none";
  titleNode.textContent = entry.title;
  metaNode.textContent = entry.monthYear || "";
  metaNode.hidden = !entry.monthYear;
  setStoryMeta(entry.title, entry.coverImage);
  section.hidden = false;
  track.innerHTML = entry.images.map((image, index) => `
    <figure class="story-figure">
      <img src="${escapeAttr(image)}" alt="${escapeAttr(`${entry.title} image ${index + 1}`)}" loading="lazy" decoding="async">
    </figure>
  `).join("");
  renderRelatedJournals(entries, entry.slug);
  setupDesktopStoryScroll();
})();
</script>
