<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Marvell Florist CMS</title>
  <link rel="icon" href="/assets/logo.webp?v=4" type="image/webp" sizes="32x32">
  <style>
    :root {
      color-scheme: light;
      font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
    }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #f5efe6;
      color: #1f1a15;
    }
    html {
      scroll-behavior: smooth;
    }
    .cms-status {
      max-width: 680px;
      margin: 10vh auto;
      padding: 20px 22px;
      border-radius: 14px;
      border: 1px solid rgba(31, 26, 21, 0.16);
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 14px 30px rgba(20, 15, 11, 0.08);
      line-height: 1.5;
    }
    .cms-status h1 {
      margin: 0 0 10px;
      font-size: 1.08rem;
      letter-spacing: 0.01em;
    }
    .cms-status p {
      margin: 0 0 10px;
      font-size: 0.95rem;
    }
    .cms-status ul {
      margin: 0;
      padding-left: 20px;
      font-size: 0.92rem;
    }
    .cms-status code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Courier New", monospace;
      background: rgba(31, 26, 21, 0.08);
      border-radius: 6px;
      padding: 2px 6px;
    }
    .cms-status.is-hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="cms-status" id="cms-status">
    <h1>Loading CMS...</h1>
    <p>The admin app is starting. If this takes too long, check your internet connection and reload.</p>
  </div>
  <noscript>
    <div class="cms-status">
      <h1>JavaScript is required</h1>
      <p>Please enable JavaScript in your browser to use the CMS.</p>
    </div>
  </noscript>
  <!--
    Decap's own config loader calls crypto.randomUUID() while it builds the
    JSON schema it validates config.yml against. That call is the first thing
    to run, so when randomUUID is missing the CMS never reaches the config at
    all and reports the failure as "Config Errors: TypeError: crypto.randomUUID
    is not a function" — which points at this file's YAML rather than at the
    browser API that is actually absent.

    randomUUID is restricted to secure contexts: it is there on https:// and on
    localhost, and gone on a plain-http LAN address (http://192.168.x.x:5500),
    which is how the admin gets opened from a phone or a second machine.
    getRandomValues carries no such restriction, so the UUID is built from it.

    This runs before the CMS bundle loads, and does nothing at all where the
    native function already exists.
  -->
  <script>
    (function () {
      var c = window.crypto || window.msCrypto;
      if (!c || typeof c.randomUUID === "function") return;
      if (typeof c.getRandomValues !== "function") return;

      // RFC 4122 v4: version nibble in byte 6, variant bits in byte 8.
      c.randomUUID = function randomUUID() {
        var bytes = new Uint8Array(16);
        c.getRandomValues(bytes);
        bytes[6] = (bytes[6] & 0x0f) | 0x40;
        bytes[8] = (bytes[8] & 0x3f) | 0x80;

        var hex = [];
        for (var i = 0; i < 16; i += 1) hex.push((bytes[i] + 0x100).toString(16).slice(1));
        return (
          hex.slice(0, 4).join("") + "-" +
          hex.slice(4, 6).join("") + "-" +
          hex.slice(6, 8).join("") + "-" +
          hex.slice(8, 10).join("") + "-" +
          hex.slice(10, 16).join("")
        );
      };
    })();
  </script>

  <script>
    // Pinned deliberately. A floating range lets a CDN publish a change
    // straight into production admin with nothing in this repository moving.
    // Raise this on purpose, and re-test /admin/ before deploying.
    const DECAP_VERSION = "3.16.2";

    const statusCard = document.getElementById("cms-status");
    const LOCAL_DECAP_PROXY_URL = "http://127.0.0.1:8081/api/v1";

    /**
     * Where the admin is being opened from decides whether there is a login.
     *
     * Editing locally is editing files on this machine: there is nothing to
     * authenticate against and nothing to protect, so the local proxy backend
     * is used and no password is asked for. That includes a LAN address —
     * opening the admin from a phone on the same wifi is still local editing,
     * and Decap's own localhost check would miss it and fall through to a
     * login screen that cannot work.
     *
     * marvellflorist.com is the opposite case: it writes to the repository,
     * so it keeps git-gateway and its Netlify Identity login. Anything that is
     * not recognised as local is treated as production, which is the safe way
     * round to be wrong.
     */
    function isLocalHostname(value) {
      const host = String(value || "").toLowerCase();
      if (["localhost", "127.0.0.1", "::1", "[::1]", ""].includes(host)) return true;
      if (host.endsWith(".local") || host.endsWith(".localhost")) return true;
      // Private IPv4: 10/8, 172.16/12, 192.168/16, and link-local 169.254/16.
      return /^10\.\d{1,3}\.\d{1,3}\.\d{1,3}$/.test(host)
        || /^192\.168\.\d{1,3}\.\d{1,3}$/.test(host)
        || /^169\.254\.\d{1,3}\.\d{1,3}$/.test(host)
        || /^172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}$/.test(host);
    }

    const isLocalAdminHost = isLocalHostname(window.location.hostname);

    // Decap is started by hand below so the backend can be chosen by host.
    window.CMS_MANUAL_INIT = true;
    const LOCAL_PROXY_WAIT_MS = 12000;
    const LOCAL_PROXY_POLL_MS = 600;
    let localProxyRecoveryTimer = 0;

    function setStatus(title, message, details = []) {
      if (!statusCard) return;
      statusCard.classList.remove("is-hidden");
      statusCard.innerHTML = `
        <h1>${title}</h1>
        <p>${message}</p>
        ${details.length ? `<ul>${details.map((item) => `<li>${item}</li>`).join("")}</ul>` : ""}
      `;
    }

    function hideStatus() {
      if (!statusCard) return;
      statusCard.classList.add("is-hidden");
    }

    function clearLocalProxyRecoveryTimer() {
      if (!localProxyRecoveryTimer) return;
      window.clearTimeout(localProxyRecoveryTimer);
      localProxyRecoveryTimer = 0;
    }

    async function waitForLocalProxy(timeoutMs = LOCAL_PROXY_WAIT_MS) {
      if (!isLocalAdminHost || typeof window.fetch !== "function") return true;
      const startedAt = Date.now();
      while ((Date.now() - startedAt) < timeoutMs) {
        try {
          await window.fetch(LOCAL_DECAP_PROXY_URL, {
            method: "GET",
            mode: "no-cors",
            cache: "no-store"
          });
          return true;
        } catch (_error) {
          // Keep polling until timeout.
        }
        await new Promise((resolve) => window.setTimeout(resolve, LOCAL_PROXY_POLL_MS));
      }
      return false;
    }

    function scheduleLocalProxyRecovery() {
      if (!isLocalAdminHost || localProxyRecoveryTimer) return;
      localProxyRecoveryTimer = window.setTimeout(async () => {
        localProxyRecoveryTimer = 0;
        const proxyReady = await waitForLocalProxy(2000);
        if (!proxyReady) {
          scheduleLocalProxyRecovery();
          return;
        }
        bootCMS();
      }, 1200);
    }

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = src;
        script.async = true;
        script.onload = () => resolve(src);
        script.onerror = () => reject(new Error(`Failed loading script: ${src}`));
        document.body.appendChild(script);
      });
    }

    /**
     * Netlify Identity, which git-gateway signs in through.
     *
     * Logging in was failing with "method not allowed". That is what
     * /.netlify/identity/token answers with when Identity is not enabled on
     * the site: the path is not served, so Netlify's own router rejects the
     * POST rather than the login being refused. Decap reports whatever came
     * back, and "method not allowed" points at nothing an editor can act on.
     *
     * Two things were missing. The widget that git-gateway authenticates
     * through was not loaded on this page at all — it is what opens the login
     * dialog and holds the session — and there was nothing to tell the
     * difference between a wrong password and a site with no Identity service
     * behind it. This asks the service who it is first, and says plainly what
     * to switch on when the answer is that it is not there.
     *
     * None of this runs for local editing, which uses the proxy backend and
     * has no login at all.
     */
    const IDENTITY_WIDGET_URL = "https://identity.netlify.com/v1/netlify-identity-widget.js";

    async function identityStatus() {
      if (typeof window.fetch !== "function") return "unknown";
      try {
        const response = await window.fetch("/.netlify/identity/settings", {
          method: "GET",
          cache: "no-store"
        });
        if (response.ok) return "ready";
        // 404 and 405 both mean the route is not being served by an Identity
        // instance: 404 where nothing answers, 405 where the platform answers
        // for a service that is switched off.
        if (response.status === 404 || response.status === 405) return "absent";
        return "unknown";
      } catch (_error) {
        // Offline, or blocked. Not evidence either way.
        return "unknown";
      }
    }

    function identityMissingMessage() {
      setStatus(
        "Netlify Identity is not switched on",
        "This admin signs in through Netlify Identity, and the site is not serving it — which is why logging in answers \"method not allowed\" rather than refusing the password. Both switches below are in the Netlify dashboard for this site, and neither needs a deploy.",
        [
          "<strong>Identity</strong> &rarr; <em>Enable Identity</em>.",
          "<strong>Identity &rarr; Services &rarr; Git Gateway</strong> &rarr; <em>Enable Git Gateway</em>. Without this the login succeeds but nothing can be saved.",
          "Under <strong>Identity &rarr; Registration</strong>, set registration to <em>Invite only</em>, then invite your own email and accept the emailed link.",
          "Then reload this page. To edit without any of this, run <code>npm run cms:proxy</code> and open <code>http://localhost:8888/admin/</code>, which needs no login."
        ]
      );
    }

    async function bootCMS() {
      if (isLocalAdminHost) {
        setStatus(
          "Starting local CMS...",
          "Admin lokal memakai backend proxy Decap — tanpa login dan tanpa kata sandi.",
          [
            "Pastikan proxy berjalan di <code>http://127.0.0.1:8081/api/v1</code>.",
            "Jika belum jalan, gunakan <code>npm run cms:proxy</code> di root project."
          ]
        );
        const proxyReady = await waitForLocalProxy();
        if (!proxyReady) {
          setStatus(
            "Local CMS backend not found",
            "Decap local backend proxy belum terdeteksi. Halaman ini akan terus mencoba tersambung tanpa fallback ke login.",
            [
              "Jalankan <code>npm run cms:proxy</code> atau <code>./start-local-cms-test.sh</code>.",
              "Begitu proxy hidup, admin akan lanjut otomatis."
            ]
          );
          scheduleLocalProxyRecovery();
          return;
        }
      }
      clearLocalProxyRecoveryTimer();

      // Production signs in through Identity, so it has to be there and it
      // has to be loaded before Decap asks it for a session.
      if (!isLocalAdminHost) {
        const status = await identityStatus();
        if (status === "absent") {
          identityMissingMessage();
          return;
        }
        setStatus("Loading CMS...", "Signing in through Netlify Identity.");
        try {
          await loadScript(IDENTITY_WIDGET_URL);
        } catch (_error) {
          setStatus(
            "The login could not be loaded",
            "Netlify Identity's widget did not load, so there is nothing to sign in with.",
            [
              "Check network access to <code>identity.netlify.com</code>.",
              "Reload this page and try again."
            ]
          );
          return;
        }
      }

      try {
        await loadScript(`https://unpkg.com/decap-cms@${DECAP_VERSION}/dist/decap-cms.js`);
      } catch (_error) {
        try {
          await loadScript(`https://cdn.jsdelivr.net/npm/decap-cms@${DECAP_VERSION}/dist/decap-cms.js`);
        } catch (_fallbackError) {
          setStatus(
            "CMS app failed to load",
            "Decap CMS could not be loaded from both CDNs.",
            [
              "Check network/firewall access to <code>unpkg.com</code> and <code>cdn.jsdelivr.net</code>.",
              "Reload this page and try again."
            ]
          );
          return;
        }
      }

      if (!window.CMS) {
        setStatus(
          "CMS app did not initialize",
          "Scripts loaded but Decap CMS was not detected.",
          ["Open browser console and check for JavaScript errors."]
        );
        return;
      }

      // Local: the proxy backend, which needs no login at all. Named here
      // rather than relying on config.yml's local_backend, because Decap only
      // honours that on localhost and this must also work over the LAN.
      //
      // Production: nothing passed, so config.yml's git-gateway stands and the
      // Netlify Identity login is required exactly as before.
      try {
        window.CMS.init(
          isLocalAdminHost
            ? { config: { backend: { name: "proxy", proxy_url: LOCAL_DECAP_PROXY_URL, branch: "main" } } }
            : undefined
        );
      } catch (error) {
        setStatus(
          "CMS app did not start",
          "Decap CMS loaded but refused to initialise.",
          [String(error && error.message ? error.message : error)]
        );
        return;
      }

      hideStatus();
    }

    function enableDecapListAutoScroll() {
      const ADD_KEYWORDS = ["add", "new", "tambah", "buat", "create"];
      let pendingScroll = null;

      function normalizeText(value) {
        return String(value || "").trim().toLowerCase();
      }

      function isAddActionButton(button) {
        if (!(button instanceof HTMLElement)) return false;
        const text = normalizeText(button.textContent);
        const aria = normalizeText(button.getAttribute("aria-label"));
        const title = normalizeText(button.getAttribute("title"));
        const combined = `${text} ${aria} ${title}`;
        return ADD_KEYWORDS.some((keyword) => combined.includes(keyword));
      }

      function getControlCount(element) {
        if (!(element instanceof Element)) return 0;
        return element.querySelectorAll("input, textarea, select, [contenteditable='true']").length;
      }

      function isVisibleElement(element) {
        if (!(element instanceof HTMLElement)) return false;
        const style = window.getComputedStyle(element);
        if (style.display === "none" || style.visibility === "hidden") return false;
        const rect = element.getBoundingClientRect();
        return rect.width > 0 && rect.height > 0;
      }

      function getEntryContainer(element) {
        let node = element instanceof Element ? element : null;
        while (node && node !== document.body) {
          if (node instanceof HTMLElement && isVisibleElement(node) && getControlCount(node) >= 3) {
            return node;
          }
          node = node.parentElement;
        }
        return element instanceof HTMLElement ? element : null;
      }

      function findBestScrollTarget() {
        const candidates = Array.from(document.querySelectorAll("input, textarea, select, [contenteditable='true']"))
          .map((field) => getEntryContainer(field))
          .filter((element, index, list) => element && isVisibleElement(element) && list.indexOf(element) === index);

        if (!candidates.length) return null;

        candidates.sort((a, b) => {
          const aTop = a.getBoundingClientRect().top + window.scrollY;
          const bTop = b.getBoundingClientRect().top + window.scrollY;
          return bTop - aTop;
        });

        return candidates[0];
      }

      function scheduleScrollToNewEntry() {
        if (pendingScroll) {
          pendingScroll.observer.disconnect();
          window.clearTimeout(pendingScroll.timeoutId);
        }

        const state = { candidate: null, timeoutId: 0, observer: null };
        state.observer = new MutationObserver((mutations) => {
          mutations.forEach((mutation) => {
            mutation.addedNodes.forEach((node) => {
              if (!(node instanceof Element)) return;
              const target = getEntryContainer(node);
              if (target) state.candidate = target;
            });
          });
        });

        state.observer.observe(document.body, { childList: true, subtree: true });
        state.timeoutId = window.setTimeout(() => {
          state.observer.disconnect();
          const target = state.candidate || findBestScrollTarget();
          if (target instanceof HTMLElement) {
            target.scrollIntoView({ behavior: "smooth", block: "start" });
          }
          pendingScroll = null;
        }, 420);

        pendingScroll = state;
      }

      document.addEventListener("click", (event) => {
        const target = event.target;
        if (!(target instanceof Element)) return;
        const button = target.closest("button, [role='button']");
        if (!isAddActionButton(button)) return;
        scheduleScrollToNewEntry();
      }, true);
    }

    bootCMS();
    enableDecapListAutoScroll();
  </script>
</body>
</html>
