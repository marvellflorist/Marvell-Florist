backend:
  name: git-gateway
  branch: main

local_backend:
  url: http://127.0.0.1:8081/api/v1
publish_mode: simple

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

slug:
  encoding: "ascii"
  clean_accents: true

collections:
  - name: "site_sections"
    label: "Home Page"
    description: "Kelola home hero tanpa edit HTML."
    editor:
      preview: false
    files:
      - label: "Home Page"
        name: "site_sections_file"
        file: "content/site-sections.json"
        format: "json"
        fields:
          - label: "Home Hero"
            name: "homeHero"
            widget: "object"
            fields:
              - { label: "Home Hero Image", name: "image", widget: "image", required: false }
              - { label: "Top Text", name: "eyebrow", widget: "string", required: false }
              - { label: "Main Title", name: "heading", widget: "string", required: false }
              - { label: "CTA Label", name: "ctaLabel", widget: "string", required: false }
              - label: "Tujuan Link"
                name: "ctaTarget"
                widget: "select"
                required: false
                options:
                  - { label: "Gallery Entry Page", value: "gallery-entry" }
                  - { label: "Primary Featured Collection", value: "featured-primary" }
          - label: "Home Portfolio"
            name: "homePortfolio"
            widget: "object"
            fields:
              - { label: "Kicker", name: "kicker", widget: "string", required: false }
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - { label: "Lead", name: "lead", widget: "text", required: false }
              - { label: "Request Note", name: "requestNote", widget: "string", required: false }
              - { label: "Request Button Label", name: "requestButtonLabel", widget: "string", required: false }
          - label: "Gallery Page Copy"
            name: "galleryPage"
            widget: "object"
            fields:
              - { label: "Portfolio Note", name: "note", widget: "text", required: false }
              - { label: "By Request Hook", name: "byRequestHook", widget: "string", required: false }
              - { label: "Consult Button Label", name: "consultButtonLabel", widget: "string", required: false }

  - name: "portfolio_products"
    label: "Product Portfolio"
    description: "Semua produk yang muncul di gallery.html. Bisa diedit, dihapus, atau ditambah tanpa sentuh HTML/CSS."
    editor:
      preview: false
    files:
      - label: "Product Portfolio Catalog"
        name: "portfolio_products_file"
        file: "content/gallery.json"
        format: "json"
        fields:
          - label: "Kategori Produk"
            name: "categories"
            widget: "list"
            summary: "{{fields.name}}"
            collapsed: true
            allow_add: true
            allow_delete: true
            fields:
              - { label: "ID Kategori", name: "key", widget: "string", hint: "Contoh: standing-flowers. Gunakan huruf kecil + dash.", required: true }
              - { label: "Nama Kategori", name: "name", widget: "string", required: true, hint: "Harus sama dengan nama kategori di 'Kategori Portofolio' agar tampil di website." }
              - label: "Produk"
                name: "items"
                widget: "list"
                summary: "{{fields.title}}"
                collapsed: true
                allow_add: true
                allow_delete: true
                fields:
                  - { label: "Kategori Internal", name: "category", widget: "string", required: false, hint: "Biarkan sama dengan kategori induk agar routing produk tetap stabil." }
                  - { label: "1) Upload Gambar", name: "image", widget: "image", required: true }
                  - label: "1b) Gambar Tambahan"
                    name: "additionalImages"
                    widget: "list"
                    required: false
                    collapsed: true
                    summary: "{{fields.image}}"
                    hint: "Gambar tambahan untuk hover desktop dan carousel di halaman produk."
                    fields:
                      - { label: "Upload Gambar Tambahan", name: "image", widget: "image", required: true }
                      - label: "Dipakai Untuk"
                        name: "usage"
                        widget: "select"
                        required: false
                        default: "both"
                        options:
                          - { label: "Hover + Carousel", value: "both" }
                          - { label: "Hover Saja", value: "hover" }
                          - { label: "Carousel Saja", value: "carousel" }
                      - { label: "Posisi Hover Desktop", name: "hoverPosition", widget: "string", required: false, hint: "Contoh: center center, 40% center, center 30%." }
                      - { label: "Posisi Carousel / Scroll", name: "scrollPosition", widget: "string", required: false, hint: "Contoh: left top, center center, 35% center." }
                  - { label: "2) Nama / Judul Produk", name: "title", widget: "string", required: true, hint: "Boleh ketik biasa. Sistem akan menampilkan dalam format Title Case." }
                  - { label: "3) Harga (Angka Saja)", name: "price", widget: "number", value_type: "int", min: 0, step: 1000, required: false, hint: "Gunakan kelipatan Rp1.000. Contoh: 15000 tampil sebagai Rp15.000." }
                  - { label: "3b) Deskripsi Produk", name: "description", widget: "text", required: false, hint: "Teks deskripsi produk yang tampil di halaman product, di bawah tombol konsultasi." }
                  - label: "4) Filter Produk"
                    name: "filters"
                    widget: "object"
                    required: false
                    collapsed: true
                    fields:
                      - label: "Warna"
                        name: "colors"
                        widget: "select"
                        required: false
                        multiple: true
                        options:
                          - { label: "Putih", value: "white" }
                          - { label: "Merah", value: "red" }
                          - { label: "Pink", value: "pink" }
                          - { label: "Ungu", value: "purple" }
                          - { label: "Biru", value: "blue" }
                          - { label: "Kuning", value: "yellow" }
                          - { label: "Oranye", value: "orange" }
                          - { label: "Peach", value: "peach" }
                          - { label: "Cokelat", value: "brown" }
                          - { label: "Abu-abu", value: "gray" }
                          - { label: "Hijau", value: "green" }
                          - { label: "Hitam", value: "black" }
                          - { label: "Emas", value: "gold" }
                          - { label: "Mixed", value: "mixed" }
                      - label: "Tipe"
                        name: "type"
                        widget: "select"
                        required: false
                        options:
                          - { label: "Pot", value: "potted" }
                          - { label: "Bloom Box", value: "bloom-box" }
                          - { label: "Cross", value: "cross" }
                          - { label: "Frame", value: "frame" }
                          - { label: "Standing Flowers", value: "standing" }
                          - { label: "Papan Bunga", value: "papan" }
                      - label: "Tipe Bunga"
                        name: "flowerCondition"
                        widget: "select"
                        required: false
                        options:
                          - { label: "Artificial", value: "artificial" }
                          - { label: "Fresh", value: "fresh" }
                          - { label: "Preserved", value: "preserved" }
                      - label: "Jenis Bunga"
                        name: "flowerTypes"
                        widget: "select"
                        required: false
                        multiple: true
                        options:
                          - { label: "Mawar", value: "mawar" }
                          - { label: "Tulip", value: "tulip" }
                          - { label: "Anggrek", value: "anggrek" }
                          - { label: "Lily", value: "lily" }
                          - { label: "Baby's Breath", value: "babys-breath" }
                          - { label: "Aster", value: "aster" }
                          - { label: "Sunflower", value: "sunflower" }
                          - { label: "Carnation", value: "carnation" }
                          - { label: "Hydrangea", value: "hydrangea" }
                          - { label: "Peony", value: "peony" }
                          - { label: "Gerbera", value: "gerbera" }
                          - { label: "Krisan", value: "chrysanthemum" }
                          - { label: "Poms", value: "poms" }
                          - { label: "Snap Dragons", value: "snap-dragons" }
                          - { label: "Gompie", value: "gompie" }
                          - { label: "Aranthera Azimah", value: "aranthera-azimah" }
                          - { label: "Lysianthus", value: "lysianthus" }
                      - label: "Momen"
                        name: "occasion"
                        widget: "select"
                        required: false
                        options:
                          - { label: "Pernikahan", value: "pernikahan" }
                          - { label: "Wisuda", value: "wisuda" }
                          - { label: "Belasungkawa", value: "belasungkawa" }
                          - { label: "Sukses", value: "sukses" }
                          - { label: "Idul Fitri", value: "idul-fitri" }
                          - { label: "Imlek", value: "imlek" }
                          - { label: "Natal", value: "natal" }
                          - { label: "Hadiah", value: "hadiah" }
                      - label: "Material"
                        name: "material"
                        widget: "select"
                        required: false
                        options:
                          - { label: "Rustic", value: "rustic" }
                          - { label: "Standard", value: "standard" }
                      - label: "Ukuran"
                        name: "size"
                        widget: "select"
                        required: false
                        options:
                          - { label: "Kecil", value: "small" }
                          - { label: "Sedang", value: "medium" }
                          - { label: "Besar", value: "large" }
                          - { label: "Grand", value: "grand" }
                          - { label: "1 Papan", value: "1-papan" }
                          - { label: "2 Papan", value: "2-papan" }

  - name: "seasonal_collections"
    label: "Featured Categories"
    description: "Kelola judul koleksi, gambar hero, produk, jadwal aktif, dan teks promo strip."
    editor:
      preview: false
    files:
      - label: "Katalog Koleksi Musiman"
        name: "seasonal_collection_catalog"
        file: "content/featured.json"
        format: "json"
        fields:
          - { label: "Kicker Default", name: "defaultKicker", widget: "string", required: false }
          - label: "Event Musiman"
            name: "events"
            widget: "list"
            summary: "{{fields.id}} — {{fields.title}}"
            collapsed: true
            allow_add: true
            allow_delete: true
            fields:
              - { label: "ID Event", name: "id", widget: "string", hint: "ID internal. Jangan diubah kecuali diminta developer.", required: true }
              - { label: "Paksa Aktif", name: "forceActive", widget: "boolean", default: false, required: false, hint: "Jika aktif, event ini langsung tampil meskipun di luar jadwal tanggal." }
              - { label: "Tampilkan di Promo Strip", name: "showInPromoStrip", widget: "boolean", default: true, required: false, hint: "Matikan jika event tetap aktif di search/featured, tetapi tidak ingin muncul di strip promo atas." }
              - { label: "Tanggal Mulai (MM-DD)", name: "start", widget: "string", required: false, hint: "Contoh: 03-07" }
              - { label: "Tanggal Selesai (MM-DD)", name: "end", widget: "string", required: false, hint: "Contoh: 04-15" }
              - { label: "Prioritas Urutan", name: "priority", widget: "number", value_type: "int", required: false, hint: "Angka lebih besar tampil lebih dulu. Jika ada beberapa koleksi aktif sekaligus, prioritas tertinggi dipakai lebih dulu di menu dan tampilan utama." }
              - { label: "Kicker", name: "kicker", widget: "string", required: false }
              - { label: "Judul Koleksi", name: "title", widget: "string", required: true }
              - { label: "Teks Promo Strip", name: "promoText", widget: "string", required: false }
              - { label: "Gambar Hero", name: "heroImage", widget: "image", required: false }
              - { label: "Lead Header", name: "lead", widget: "text", required: false, hint: "Copy pendek di bawah judul seasonal collection." }
              - { label: "Gambar Footer Koleksi", name: "footerImage", widget: "image", required: false, hint: "Gambar editorial besar yang tampil di bagian penutup halaman featured." }
              - { label: "Slogan Footer Koleksi", name: "footerSlogan", widget: "text", required: false, hint: "Copy pendek di bawah gambar footer halaman featured." }
              - { label: "Catatan Bawah Produk", name: "warningText", widget: "text", required: false, hint: "Teks kecil di bawah grid produk seasonal." }
              - { label: "Label Tombol Konsultasi", name: "consultLabel", widget: "string", required: false, hint: "Contoh: Consult Ramadan & Eid Collection" }
              - { label: "Aktifkan Filter Harga", name: "enablePriceFilter", widget: "boolean", default: true, required: false, hint: "Untuk UI filter featured: tampilkan slider harga berdasarkan produk di event ini." }
              - { label: "Harga Minimum Slider", name: "priceMin", widget: "number", value_type: "int", min: 0, step: 1000, required: false, hint: "Opsional. Gunakan kelipatan Rp1.000 untuk batas bawah slider." }
              - { label: "Harga Maksimum Slider", name: "priceMax", widget: "number", value_type: "int", min: 0, step: 1000, required: false, hint: "Opsional. Gunakan kelipatan Rp1.000 untuk batas atas slider." }
              - label: "Produk Musiman"
                name: "products"
                widget: "list"
                summary: "{{fields.name}} — {{fields.price}}"
                collapsed: true
                allow_add: true
                allow_delete: true
                fields:
                  - { label: "1) Upload Gambar", name: "src", widget: "image", required: true }
                  - label: "1b) Gambar Tambahan"
                    name: "additionalImages"
                    widget: "list"
                    required: false
                    collapsed: true
                    summary: "{{fields.image}}"
                    hint: "Gambar tambahan untuk hover desktop dan carousel di halaman produk."
                    fields:
                      - { label: "Upload Gambar Tambahan", name: "image", widget: "image", required: true }
                      - label: "Dipakai Untuk"
                        name: "usage"
                        widget: "select"
                        required: false
                        default: "both"
                        options:
                          - { label: "Hover + Carousel", value: "both" }
                          - { label: "Hover Saja", value: "hover" }
                          - { label: "Carousel Saja", value: "carousel" }
                      - { label: "Posisi Hover Desktop", name: "hoverPosition", widget: "string", required: false, hint: "Contoh: center center, 40% center, center 30%." }
                      - { label: "Posisi Carousel / Scroll", name: "scrollPosition", widget: "string", required: false, hint: "Contoh: left top, center center, 35% center." }
                  - { label: "2) Nama / Judul Produk", name: "name", widget: "string", required: true }
                  - { label: "3) Harga (Angka Saja)", name: "price", widget: "number", value_type: "int", min: 0, step: 1000, required: false, hint: "Gunakan kelipatan Rp1.000. Contoh: 15000 tampil sebagai Rp15.000." }
                  - { label: "3b) Deskripsi Produk", name: "description", widget: "text", required: false, hint: "Teks deskripsi produk yang tampil di halaman product, di bawah tombol konsultasi." }
                  - label: "4) Filter Produk Unggulan"
                    name: "filters"
                    widget: "object"
                    required: false
                    collapsed: true
                    hint: "Dipakai untuk filter featured/search. Isi seperlunya saja."
                    fields:
                      - label: "Jenis Produk"
                        name: "type"
                        widget: "select"
                        required: false
                        options:
                          - { label: "Bouquet", value: "bouquet" }
                          - { label: "Table Arrangements", value: "artificial" }
                          - { label: "Standing Flowers", value: "standing" }
                          - { label: "Parcel", value: "parcel" }
                          - { label: "Papan Bunga", value: "papan" }
                          - { label: "Bloom Box", value: "bloom-box" }
                          - { label: "Pot", value: "pot" }
                          - { label: "Basket", value: "basket" }
                      - label: "Skema Warna"
                        name: "colors"
                        widget: "select"
                        required: false
                        multiple: true
                        options:
                          - { label: "Putih", value: "white" }
                          - { label: "Merah", value: "red" }
                          - { label: "Pink", value: "pink" }
                          - { label: "Ungu", value: "purple" }
                          - { label: "Biru", value: "blue" }
                          - { label: "Kuning", value: "yellow" }
                          - { label: "Oranye", value: "orange" }
                          - { label: "Peach", value: "peach" }
                          - { label: "Cokelat", value: "brown" }
                          - { label: "Abu-abu", value: "gray" }
                          - { label: "Hijau", value: "green" }
                          - { label: "Hitam", value: "black" }
                          - { label: "Emas", value: "gold" }
                          - { label: "Mixed", value: "mixed" }
                      - label: "Tipe Bunga"
                        name: "flowerCondition"
                        widget: "select"
                        required: false
                        options:
                          - { label: "Artificial", value: "artificial" }
                          - { label: "Fresh", value: "fresh" }
                          - { label: "Preserved", value: "preserved" }
                      - label: "Jenis Bunga"
                        name: "flowerTypes"
                        widget: "select"
                        required: false
                        multiple: true
                        options:
                          - { label: "Mawar", value: "mawar" }
                          - { label: "Tulip", value: "tulip" }
                          - { label: "Anggrek", value: "anggrek" }
                          - { label: "Lily", value: "lily" }
                          - { label: "Baby's Breath", value: "babys-breath" }
                          - { label: "Aster", value: "aster" }
                          - { label: "Sunflower", value: "sunflower" }
                          - { label: "Carnation", value: "carnation" }
                          - { label: "Hydrangea", value: "hydrangea" }
                          - { label: "Peony", value: "peony" }
                          - { label: "Gerbera", value: "gerbera" }
                          - { label: "Krisan", value: "chrysanthemum" }
                          - { label: "Poms", value: "poms" }
                          - { label: "Snap Dragons", value: "snap-dragons" }
                          - { label: "Gompie", value: "gompie" }
                          - { label: "Aranthera Azimah", value: "aranthera-azimah" }
                          - { label: "Lysianthus", value: "lysianthus" }

  - name: "stories"
    label: "The Journals"
    description: "Kelola halaman The Journals / lookbook: judul halaman, cover image, judul journal, dan semua gambar di dalamnya."
    editor:
      preview: false
    files:
      - label: "The Journals Page"
        name: "stories_page_file"
        file: "content/stories.json"
        format: "json"
        fields:
          - { label: "Judul Halaman", name: "pageTitle", widget: "string", required: true }
          - label: "Daftar Journal"
            name: "entries"
            widget: "list"
            summary: "{{fields.title}} — {{fields.monthYear}}"
            collapsed: true
            allow_add: true
            allow_delete: true
            fields:
              - { label: "Slug / URL", name: "slug", widget: "string", required: true, hint: "Contoh: wedding-direction. Gunakan huruf kecil dan dash." }
              - { label: "Judul Journal", name: "title", widget: "string", required: true }
              - { label: "Month & Year", name: "monthYear", widget: "string", required: true, hint: "Contoh: April 2026" }
              - { label: "Cover Image", name: "coverImage", widget: "image", required: true }
              - label: "Images"
                name: "images"
                widget: "list"
                collapsed: true
                allow_add: true
                allow_delete: true
                field: { label: "Upload Image", name: "image", widget: "image", required: true }

  - name: "retail_collections"
    label: "Shop — Collections"
    description: "Peluncuran koleksi retail (Soft Tones, Christmas, Valentine's). Mengatur cerita, hero, palet, dan SKU mana yang tampil di Featured. Koleksi adalah pengelompokan katalog, bukan halaman tersendiri. HARGA DAN STOK TIDAK DIATUR DI SINI — keduanya hidup di database Supabase."
    editor:
      preview: false
    files:
      - label: "Retail Collection Launches"
        name: "retail_collections_file"
        file: "content/collections.json"
        format: "json"
        fields:
          - label: "Koleksi"
            name: "collections"
            widget: "list"
            summary: "{{fields.title}} — {{fields.status}}"
            collapsed: true
            allow_add: true
            allow_delete: true
            fields:
              - { label: "ID Koleksi", name: "id", widget: "string", required: true, hint: "ID internal permanen. Contoh: soft-tones-2026. Jangan diubah setelah koleksi terbit." }
              - { label: "Judul Koleksi", name: "title", widget: "string", required: true, hint: "Contoh: Soft Tones" }
              - { label: "Slug / URL", name: "slug", widget: "string", required: true, hint: "Nama pendek koleksi untuk keperluan internal. Koleksi tidak lagi punya halaman sendiri — retail tampil di Featured. Huruf kecil dan dash saja." }
              - label: "Status"
                name: "status"
                widget: "select"
                required: true
                default: "upcoming"
                hint: "Active = tampil di Shop dan bisa dibeli. Upcoming = tampil sebagai akan datang. Archived = tetap bisa dibuka lewat link, tidak tampil di menu."
                options:
                  - { label: "Aktif", value: "active" }
                  - { label: "Akan Datang", value: "upcoming" }
                  - { label: "Arsip", value: "archived" }
              - { label: "Kicker", name: "kicker", widget: "string", required: false, hint: "Teks kecil di atas judul. Contoh: COLLECTION 01" }
              - { label: "Tanggal Peluncuran", name: "launch_date", widget: "date", format: "YYYY-MM-DD", required: false }
              - { label: "Tanggal Berakhir", name: "end_date", widget: "date", format: "YYYY-MM-DD", required: false }
              - { label: "Gambar Hero", name: "hero_image", widget: "image", required: false }
              - { label: "Link Trailer / Video", name: "trailer_url", widget: "string", required: false, hint: "Opsional. Hanya link YouTube atau Vimeo. Kosongkan jika tidak ada." }
              - { label: "Deskripsi Koleksi", name: "description", widget: "text", required: false, hint: "Paragraf pendek di bawah judul koleksi." }
              - { label: "Teks Editorial", name: "editorial_copy", widget: "text", required: false, hint: "Paragraf panjang di bagian bawah halaman koleksi. Opsional." }
              - label: "Palet Warna"
                name: "palette"
                widget: "list"
                required: false
                collapsed: true
                summary: "{{fields.name}} — {{fields.hex}}"
                hint: "Warna yang ditampilkan di halaman koleksi, dan nanti dipakai staf sebagai acuan produksi."
                fields:
                  - { label: "Nama Warna", name: "name", widget: "string", required: true, hint: "Contoh: Porcelain" }
                  - { label: "Kode Hex", name: "hex", widget: "string", required: true, hint: "Contoh: #EFE7DC" }
              - label: "SKU Yang Ditampilkan"
                name: "product_ids"
                widget: "list"
                required: false
                hint: "Daftar SKU dari 'Shop — Products'. Urutan di sini menentukan urutan tampil di halaman koleksi."
                field: { label: "SKU", name: "sku", widget: "string" }
              - { label: "SEO Title", name: "seo_title", widget: "string", required: false }
              - { label: "SEO Description", name: "seo_description", widget: "text", required: false }

  - name: "retail_commerce"
    label: "Shop — Stock & Availability"
    description: "Saklar stok. Matikan 'Bisa Dibeli' kapan saja untuk membuat sebuah rangkaian habis — berlaku langsung, tanpa perlu menyentuh Supabase. Harga dan jumlah stok di sini hanya dipakai untuk SKU yang belum punya baris di Supabase; begitu Supabase punya barisnya, Supabase yang menentukan harga dan jumlah, dan halaman ini hanya bisa menarik produk dari penjualan, tidak pernah menambah stok."
    editor:
      preview: false
    files:
      - label: "Stock & Availability"
        name: "retail_commerce_file"
        file: "content/retail-commerce.json"
        format: "json"
        fields:
          - label: "Produk"
            name: "products"
            widget: "list"
            summary: "{{fields.sku}} — {{fields.name}}"
            collapsed: true
            allow_add: true
            allow_delete: true
            fields:
              - { label: "SKU", name: "sku", widget: "string", required: true, pattern: ["^[A-Z0-9]{2,6}-[0-9]{2,3}$", "Format SKU: dua sampai enam huruf besar, dash, lalu angka. Contoh: MD-01"], hint: "Harus sama persis dengan SKU di 'Shop — Products'." }
              - { label: "Nama", name: "name", widget: "string", required: false, hint: "Hanya untuk memudahkan membaca daftar ini. Tidak tampil di situs." }
              - { label: "Bisa Dibeli", name: "available", widget: "boolean", default: true, required: false, hint: "Matikan untuk membuat rangkaian ini habis sekarang juga. Ini satu-satunya kolom di halaman ini yang selalu berlaku, apa pun isi Supabase." }
              - { label: "Harga (IDR)", name: "price_idr", widget: "number", value_type: "int", min: 0, step: 1000, required: false, hint: "Hanya dipakai jika SKU ini belum ada di Supabase. Gunakan kelipatan Rp1.000 tanpa titik. Contoh: 550000" }
              - { label: "Jumlah Stok", name: "stock_quantity", widget: "number", value_type: "int", min: 0, required: false, hint: "Hanya dipakai jika SKU ini belum ada di Supabase. Kalau 0, rangkaian tampil habis." }

  - name: "retail_products"
    label: "Shop — Products"
    description: "Konten produk retail: nama, foto, deskripsi, bahan, ukuran. HARGA DAN STOK DIATUR DI SUPABASE, bukan di sini. Menambah produk di sini saja tidak membuatnya bisa dibeli — SKU-nya juga harus ada di tabel products_commerce."
    editor:
      preview: false
    files:
      - label: "Retail Product Catalogue"
        name: "retail_products_file"
        file: "content/retail-products.json"
        format: "json"
        fields:
          - label: "Produk Retail"
            name: "products"
            widget: "list"
            summary: "{{fields.sku}} — {{fields.name}}"
            collapsed: true
            allow_add: true
            allow_delete: true
            fields:
              - { label: "SKU", name: "sku", widget: "string", required: true, pattern: ["^[A-Z0-9]{2,6}-[0-9]{2,3}$", "Format SKU: dua sampai enam huruf besar, dash, lalu angka. Contoh: ST-01"], hint: "Kode permanen. HARUS sama persis dengan SKU di tabel products_commerce di Supabase. Jangan pernah diubah setelah produk terbit." }
              - { label: "Slug / URL", name: "slug", widget: "string", required: true, hint: "Menentukan alamat halaman: /product/soft-tones-no-1. Huruf kecil dan dash saja." }
              - { label: "Nama Produk", name: "name", widget: "string", required: true }
              - { label: "ID Koleksi", name: "collection_id", widget: "string", required: true, hint: "Harus sama dengan ID Koleksi di 'Shop — Collections'. Contoh: soft-tones-2026" }
              - label: "Foto Produk"
                name: "images"
                widget: "list"
                required: true
                collapsed: true
                summary: "{{fields.image}}"
                hint: "Foto pertama dipakai sebagai gambar utama di kartu produk."
                fields:
                  - { label: "Upload Gambar", name: "image", widget: "image", required: true }
                  - { label: "Teks Alternatif", name: "alt", widget: "string", required: false, hint: "Deskripsi singkat untuk pembaca layar dan SEO." }
              - { label: "Deskripsi", name: "description", widget: "text", required: false }
              - { label: "Komposisi / Bahan", name: "composition", widget: "text", required: false, hint: "Contoh: Artificial roses, ranunculus and eucalyptus in a matte ceramic vessel. Gunakan istilah 'artificial', jangan 'fake'." }
              - { label: "Dimensi", name: "dimensions", widget: "string", required: false, hint: "Contoh: Approx. 28cm wide x 22cm tall" }
              - { label: "Catatan Perawatan", name: "care_notes", widget: "text", required: false }
              - { label: "Bisa Diminta Versi Bunga Segar", name: "fresh_interpretation_available", widget: "boolean", default: true, required: false, hint: "Jika aktif, halaman produk menampilkan tombol 'Request Fresh Interpretation' yang membuka WhatsApp konsultasi." }
              - label: "Tag Editorial"
                name: "tags"
                widget: "list"
                required: false
                field: { label: "Tag", name: "tag", widget: "string" }
              - { label: "Catatan Styling / Produksi", name: "styling_notes", widget: "text", required: false, hint: "Tampil di halaman produk sebagai catatan styling, dan nanti jadi acuan staf saat merangkai." }
