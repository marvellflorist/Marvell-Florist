backend:
  name: git-gateway
  branch: main

local_backend:
  url: http://127.0.0.1:8081/api/v1
publish_mode: simple

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

slug:
  encoding: "ascii"
  clean_accents: true

collections:
  - name: "site_sections"
    label: "Teks Halaman"
    description: "Kelola copy untuk header portofolio di home dan catatan halaman gallery tanpa edit HTML."
    editor:
      preview: false
    files:
      - label: "Teks Section Website"
        name: "site_sections_file"
        file: "content/site-sections.json"
        format: "json"
        fields:
          - label: "Home Portfolio"
            name: "homePortfolio"
            widget: "object"
            fields:
              - { label: "Kicker", name: "kicker", widget: "string", required: false }
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - { label: "Lead", name: "lead", widget: "text", required: false }
              - { label: "Catatan Request", name: "requestNote", widget: "string", required: false }
              - { label: "Teks Tombol Request", name: "requestButtonLabel", widget: "string", required: false }
          - label: "Gallery Page"
            name: "galleryPage"
            widget: "object"
            fields:
              - { label: "Catatan Katalog", name: "note", widget: "text", required: false }
              - { label: "Teks Hook By Request", name: "byRequestHook", widget: "text", required: false }
              - { label: "Teks Tombol Konsultasi", name: "consultButtonLabel", widget: "string", required: false }

  - name: "portfolio_categories"
    label: "Home Portfolio"
    description: "Kelola kategori portfolio untuk kartu di home page dan header hero di gallery page."
    editor:
      preview: false
    files:
      - label: "Home Portfolio Categories"
        name: "portfolio_category_settings"
        file: "content/portfolio-categories.json"
        format: "json"
        fields:
          - label: "Daftar Kategori"
            name: "categories"
            widget: "list"
            summary: "{{fields.name}}"
            collapsed: true
            default: []
            allow_add: true
            allow_delete: true
            fields:
              - { label: "ID Kategori", name: "key", widget: "string", hint: "ID internal. Jangan diubah kecuali diminta developer.", required: true }
              - { label: "Nama Kategori", name: "name", widget: "string", required: true }
              - { label: "Gambar Cover Kategori", name: "coverImage", widget: "image", required: true }
              - { label: "Deskripsi Singkat", name: "subtitle", widget: "text", required: false }
              - { label: "Nomor WhatsApp", name: "phone", widget: "string", required: false, hint: "Contoh: 6281275017456" }
              - label: "Nama Alternatif"
                name: "aliases"
                widget: "list"
                required: false
                default: []
                summary: "{{fields.value}}"
                allow_add: true
                fields:
                  - { label: "Alias", name: "value", widget: "string" }
              - label: "Kata Kunci Mapping (Legacy)"
                name: "matchCategories"
                widget: "list"
                required: false
                default: []
                summary: "{{fields.value}}"
                allow_add: true
                fields:
                  - { label: "Kata Kunci", name: "value", widget: "string" }
              - label: "Struktur Filter Kategori"
                name: "filterGroups"
                widget: "list"
                required: false
                summary: "{{fields.label}}"
                collapsed: true
                default: []
                allow_add: true
                allow_delete: true
                fields:
                  - label: "ID Grup Filter"
                    name: "id"
                    widget: "select"
                    required: true
                    options:
                      - { label: "Warna", value: "color" }
                      - { label: "Tipe", value: "type" }
                      - { label: "Tipe Bunga", value: "flower-condition" }
                      - { label: "Jenis Bunga", value: "flower-type" }
                      - { label: "Momen", value: "occasion" }
                      - { label: "Material", value: "material" }
                      - { label: "Ukuran", value: "size" }
                  - { label: "Nama Grup Filter", name: "label", widget: "string", required: true }
                  - label: "Pilihan Filter"
                    name: "options"
                    widget: "list"
                    required: true
                    summary: "{{fields.label}}"
                    collapsed: true
                    default: []
                    allow_add: true
                    allow_delete: true
                    fields:
                      - { label: "ID Opsi", name: "id", widget: "string", required: true, hint: "Gunakan huruf kecil + dash. Contoh: bloom-box" }
                      - { label: "Label Opsi", name: "label", widget: "string", required: true }
              - { label: "Aktifkan Filter Harga", name: "enablePriceFilter", widget: "boolean", default: false, required: false, hint: "Jika aktif, kategori ini menampilkan slider rentang harga di halaman portofolio." }
              - { label: "Harga Minimum Default", name: "priceMin", widget: "number", value_type: "int", min: 0, required: false, hint: "Batas bawah kategori. Dipakai sebagai awal slider harga meskipun produk di dalamnya belum lengkap." }
              - { label: "Harga Maksimum Default", name: "priceMax", widget: "number", value_type: "int", min: 0, required: false, hint: "Batas atas kategori untuk slider harga." }
              - { label: "Tampilkan di Home", name: "showOnHome", widget: "boolean", default: true, required: false }
              - { label: "Tampilkan di Halaman Portofolio", name: "showInGallery", widget: "boolean", default: true, required: false }
              - { label: "Urutan Tampil", name: "order", widget: "number", value_type: "int", min: 1, required: false }

  - name: "portfolio_products"
    label: "Product Portfolio"
    description: "Semua produk yang muncul di gallery.html. Bisa diedit, dihapus, atau ditambah tanpa sentuh HTML/CSS."
    editor:
      preview: false
    files:
      - label: "Product Portfolio Catalog"
        name: "portfolio_products_file"
        file: "content/gallery.json"
        format: "json"
        fields:
          - label: "Kategori Produk"
            name: "categories"
            widget: "list"
            summary: "{{fields.name}}"
            collapsed: true
            allow_add: true
            allow_delete: true
            fields:
              - { label: "ID Kategori", name: "key", widget: "string", hint: "Contoh: standing-flowers. Gunakan huruf kecil + dash.", required: true }
              - { label: "Nama Kategori", name: "name", widget: "string", required: true, hint: "Harus sama dengan nama kategori di 'Kategori Portofolio' agar tampil di website." }
              - label: "Produk"
                name: "items"
                widget: "list"
                summary: "{{fields.title}}"
                collapsed: true
                allow_add: true
                allow_delete: true
                fields:
                  - { label: "Kategori Internal", name: "category", widget: "string", required: false, hint: "Biarkan sama dengan kategori induk agar routing produk tetap stabil." }
                  - { label: "1) Upload Gambar", name: "image", widget: "image", required: true }
                  - { label: "2) Nama / Judul Produk", name: "title", widget: "string", required: true, hint: "Boleh ketik biasa. Sistem akan menampilkan dalam format Title Case." }
                  - { label: "3) Harga (Angka Saja)", name: "price", widget: "number", value_type: "int", min: 0, required: false, hint: "Contoh input: 15000 (otomatis tampil sebagai Rp15.000)." }
                  - label: "4) Filter Produk"
                    name: "filters"
                    widget: "object"
                    required: false
                    collapsed: true
                    fields:
                      - label: "Warna"
                        name: "colors"
                        widget: "select"
                        required: false
                        multiple: true
                        options:
                          - { label: "Putih", value: "white" }
                          - { label: "Merah", value: "red" }
                          - { label: "Pink", value: "pink" }
                          - { label: "Ungu", value: "purple" }
                          - { label: "Biru", value: "blue" }
                          - { label: "Kuning", value: "yellow" }
                          - { label: "Oranye", value: "orange" }
                          - { label: "Hijau", value: "green" }
                          - { label: "Hitam", value: "black" }
                          - { label: "Emas", value: "gold" }
                          - { label: "Mixed", value: "mixed" }
                      - label: "Tipe"
                        name: "type"
                        widget: "select"
                        required: false
                        options:
                          - { label: "Pot", value: "potted" }
                          - { label: "Bloom Box", value: "bloom-box" }
                          - { label: "Cross", value: "cross" }
                          - { label: "Frame", value: "frame" }
                          - { label: "Standing Flowers", value: "standing" }
                          - { label: "Papan Bunga", value: "papan" }
                      - label: "Tipe Bunga"
                        name: "flowerCondition"
                        widget: "select"
                        required: false
                        options:
                          - { label: "Artificial", value: "artificial" }
                          - { label: "Fresh", value: "fresh" }
                          - { label: "Preserved", value: "preserved" }
                      - label: "Jenis Bunga"
                        name: "flowerTypes"
                        widget: "select"
                        required: false
                        multiple: true
                        options:
                          - { label: "Mawar", value: "mawar" }
                          - { label: "Tulip", value: "tulip" }
                          - { label: "Anggrek", value: "anggrek" }
                          - { label: "Lily", value: "lily" }
                          - { label: "Baby's Breath", value: "babys-breath" }
                          - { label: "Aster", value: "aster" }
                          - { label: "Sunflower", value: "sunflower" }
                          - { label: "Carnation", value: "carnation" }
                          - { label: "Hydrangea", value: "hydrangea" }
                          - { label: "Peony", value: "peony" }
                          - { label: "Gerbera", value: "gerbera" }
                          - { label: "Krisan", value: "chrysanthemum" }
                      - label: "Momen"
                        name: "occasion"
                        widget: "select"
                        required: false
                        options:
                          - { label: "Pernikahan", value: "pernikahan" }
                          - { label: "Wisuda", value: "wisuda" }
                          - { label: "Belasungkawa", value: "belasungkawa" }
                          - { label: "Sukses", value: "sukses" }
                          - { label: "Idul Fitri", value: "idul-fitri" }
                          - { label: "Imlek", value: "imlek" }
                          - { label: "Natal", value: "natal" }
                          - { label: "Hadiah", value: "hadiah" }
                      - label: "Material"
                        name: "material"
                        widget: "select"
                        required: false
                        options:
                          - { label: "Rustic", value: "rustic" }
                          - { label: "Standard", value: "standard" }
                      - label: "Ukuran"
                        name: "size"
                        widget: "select"
                        required: false
                        options:
                          - { label: "Kecil", value: "small" }
                          - { label: "Sedang", value: "medium" }
                          - { label: "Besar", value: "large" }
                          - { label: "Grand", value: "grand" }
                          - { label: "1 Papan", value: "1-papan" }
                          - { label: "2 Papan", value: "2-papan" }

  - name: "seasonal_collections"
    label: "Galaksi Musiman"
    description: "Kelola judul koleksi, gambar hero, produk, jadwal aktif, dan teks promo strip."
    editor:
      preview: false
    files:
      - label: "Katalog Koleksi Musiman"
        name: "seasonal_collection_catalog"
        file: "content/featured.json"
        format: "json"
        fields:
          - { label: "Kicker Default", name: "defaultKicker", widget: "string", required: false }
          - label: "Event Musiman"
            name: "events"
            widget: "list"
            summary: "{{fields.id}} — {{fields.title}}"
            collapsed: true
            allow_add: true
            allow_delete: true
            fields:
              - { label: "ID Event", name: "id", widget: "string", hint: "ID internal. Jangan diubah kecuali diminta developer.", required: true }
              - { label: "Paksa Aktif", name: "forceActive", widget: "boolean", default: false, required: false, hint: "Jika aktif, event ini langsung tampil meskipun di luar jadwal tanggal." }
              - { label: "Tanggal Mulai (MM-DD)", name: "start", widget: "string", required: false, hint: "Contoh: 03-07" }
              - { label: "Tanggal Selesai (MM-DD)", name: "end", widget: "string", required: false, hint: "Contoh: 04-15" }
              - { label: "Prioritas", name: "priority", widget: "number", value_type: "int", required: false, hint: "Semakin besar, semakin diprioritaskan jika overlap." }
              - { label: "Kicker", name: "kicker", widget: "string", required: false }
              - { label: "Judul Koleksi", name: "title", widget: "string", required: true }
              - { label: "Teks Promo Strip", name: "promoText", widget: "string", required: false }
              - { label: "Gambar Hero", name: "heroImage", widget: "image", required: false }
              - { label: "Lead Header", name: "lead", widget: "text", required: false, hint: "Copy pendek di bawah judul seasonal collection." }
              - { label: "Catatan Bawah Produk", name: "warningText", widget: "text", required: false, hint: "Teks kecil di bawah grid produk seasonal." }
              - { label: "Label Tombol Konsultasi", name: "consultLabel", widget: "string", required: false, hint: "Contoh: Consult Ramadan & Eid Collection" }
              - label: "Produk Musiman"
                name: "products"
                widget: "list"
                summary: "{{fields.name}} — {{fields.price}}"
                collapsed: true
                allow_add: true
                allow_delete: true
                fields:
                  - { label: "1) Upload Gambar", name: "src", widget: "image", required: true }
                  - { label: "2) Nama / Judul Produk", name: "name", widget: "string", required: true }
                  - { label: "3) Harga (Angka Saja)", name: "price", widget: "number", value_type: "int", min: 0, required: false, hint: "Contoh input: 15000 (otomatis tampil sebagai Rp15.000)." }
