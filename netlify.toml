[build]
  publish = "."

# ---------------------------------------------------------------------------
# Local development — the canonical environment
#
# `netlify dev` at http://localhost:8888 is the ONLY local environment that
# runs the real application architecture: the same functions, the same routing
# table and the same redirects as production, with secrets injected from .env
# server-side. A feature is not "tested" until it has been tested here.
#
# VS Code Live Server and scripts/dev-server.mjs serve static files only. They
# cannot run netlify/functions, so nothing touching Brevo, Supabase, My
# Marvell, the bag validation or iPaymu can be exercised on them. The
# stand-in deliberately defaults to 8889 so it can never shadow this port.
#
# SITE_ORIGIN must be http://localhost:8888 in .env: the sign-in link in the
# email and the Google PKCE callback are both built from it.
#
# Env precedence: values in .env win for local runs. If this directory is ever
# linked to the Netlify site (`netlify link`), the CLI also pulls that site's
# environment — which would point local development at the PRODUCTION Brevo
# list. Keep it unlinked, or check `netlify dev`'s startup log, which names
# every variable it injected and where it came from.
# ---------------------------------------------------------------------------
[dev]
  framework = "#static"
  publish = "."
  port = 8888
  autoLaunch = false

# Serverless functions. The site itself still has no build step; only the
# functions are bundled, and they carry the CMS catalogue with them so that
# /api/catalog can read it from disk instead of over the network.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # The commerce prototype is excluded deliberately: MARVELL_COMMERCE_TEST is
  # off in production, and the file it reads is not shipped either.
  included_files = ["content/**", "!content/_dev-*.json"]

# ---------------------------------------------------------------------------
# Security headers
#
# No Content-Security-Policy yet: the existing pages carry large inline
# <script> and <style> blocks, so a policy strict enough to be worth having
# would break them. Worth doing as its own piece of work later.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(self)"

# API responses must never be cached by a browser or an intermediary: they
# carry live stock, prices and order state.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow"

# ---------------------------------------------------------------------------
# Not public. publish = "." serves the whole repository, so source, SQL,
# setup notes and dev data are refused here. These rules come
# first because the first matching redirect wins. /email/ stays public: the
# sign-in email loads its images from it.
# ---------------------------------------------------------------------------
[[redirects]]
