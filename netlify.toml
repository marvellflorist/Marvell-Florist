# --- Commerce pages: canonical pretty URLs ---------------------------------

# The Shop preview page is gone, and so is the separate Collections index:
# Featured is the one retail entry point. Every old spelling lands there so
# nothing that was linked or bookmarked dies.
[[redirects]]
  from = "/shop.html"
  to = "/featured"
  status = 301
  force = true

[[redirects]]
  from = "/account.html"
  to = "/account"
  status = 301
  force = true

# The account was called "My Marvell" in the route as well as the copy. Both
# old spellings are kept permanently: /my-marvell was linked from sign-in
# emails, which are read long after they are sent.
[[redirects]]
  from = "/my-marvell.html"
  to = "/account"
  status = 301
  force = true

[[redirects]]
  from = "/my-marvell"
  to = "/account"
  status = 301
  force = true

[[redirects]]
  from = "/collections.html"
  to = "/featured"
  status = 301
  force = true

# The bag was briefly "cart", in the route as well as the copy. Both old
# spellings are kept as permanent redirects: /cart may be in a browser history
# or a bookmark, and it should land on the bag rather than on a 404.
[[redirects]]
  from = "/bag.html"
  to = "/bag"
  status = 301
  force = true

[[redirects]]
  from = "/cart.html"
  to = "/bag"
  status = 301
  force = true

[[redirects]]
  from = "/cart"
  to = "/bag"
  status = 301
  force = true

[[redirects]]
  from = "/checkout.html"
  to = "/checkout"
  status = 301
  force = true

# --- Commerce pages: rewrites ----------------------------------------------
#
# Order matters. Netlify takes the first rule that matches, so the exact
# /product rule (the existing consultation product page, which reads its
# arrangement from ?category=&title=) is left above the /product/:slug splat
# that serves the new retail SKUs. The two never collide: "/product" does not
# match "/product/*".

[[redirects]]
  from = "/shop"
  to = "/featured"
  status = 301
  force = true

[[redirects]]
  from = "/account"
  to = "/account.html"
  status = 200

# The collection index and the per-collection page are gone. A collection is
# still a grouping in the catalogue, it just has no page of its own any more:
# retail lives inside Featured. Both URLs were indexed and linked, so both are
# kept as permanent redirects rather than left to 404.
[[redirects]]
  from = "/collections"
  to = "/featured"
  status = 301
  force = true

[[redirects]]
  from = "/collections/*"
  to = "/featured"
  status = 301
  force = true

[[redirects]]
  from = "/product/*"
  to = "/shop-product.html"
  status = 200

[[redirects]]
  from = "/bag"
  to = "/bag.html"
  status = 200

[[redirects]]
  from = "/checkout"
  to = "/checkout.html"
  status = 200

[[redirects]]
  from = "/order/*"
  to = "/order.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301
  force = true

# Marvell Admin is a separate Netlify site. The public site's root publish
# includes repository folders, so never serve its static app here.
[[redirects]]
  from = "/marvell-admin"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/marvell-admin/*"
  to = "/index.html"
  status = 404
  force = true
