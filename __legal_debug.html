<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legal Debug</title>
  <style>
    body {
      margin: 0;
      font: 14px/1.4 sans-serif;
      background: #f4f1ea;
      color: #2f2923;
    }
    .wrap {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      padding: 16px;
    }
    pre {
      margin: 0;
      padding: 12px;
      border: 1px solid rgba(63, 54, 45, 0.18);
      background: #fffdf9;
      white-space: pre-wrap;
      word-break: break-word;
    }
    iframe {
      width: 1440px;
      height: 2200px;
      border: 1px solid rgba(63, 54, 45, 0.18);
      background: white;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <pre id="result">Waiting…</pre>
    <iframe id="frame" src=""></iframe>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const page = params.get("page") || "privacy-policy.html?lang=en";
    const iframe = document.getElementById("frame");
    const result = document.getElementById("result");
    iframe.src = page;

    function handleInitialLoad() {
      const doc = iframe.contentDocument;
      const win = iframe.contentWindow;
      if (!doc || !win) {
        result.textContent = "No iframe document.";
        return;
      }

      const suiteLink = doc.querySelector(".legal-suite-link[href*='faq.html'], .legal-suite-link[href*='privacy-policy.html'], .legal-suite-link[href*='terms-conditions.html']");
      const tocLink = doc.querySelectorAll(".legal-toc-link")[1] || doc.querySelector(".legal-toc-link");
      const sidebar = doc.querySelector(".legal-sidebar");

      function inspectLink(node, label) {
        if (!(node instanceof win.HTMLAnchorElement)) {
          return { label, found: false };
        }
        const rect = node.getBoundingClientRect();
        const x = rect.left + rect.width / 2;
        const y = rect.top + rect.height / 2;
        const topNode = doc.elementFromPoint(x, y);
        return {
          label,
          found: true,
          href: node.href,
          text: node.textContent.trim(),
          rect: {
            left: Math.round(rect.left),
            top: Math.round(rect.top),
            width: Math.round(rect.width),
            height: Math.round(rect.height)
          },
          topNode: topNode ? {
            tag: topNode.tagName,
            className: topNode.className,
            text: (topNode.textContent || "").trim().slice(0, 80)
          } : null,
          containsTopNode: !!(topNode && node.contains(topNode)),
          isTopNode: topNode === node
        };
      }

      const sidebarRect = sidebar instanceof win.HTMLElement ? sidebar.getBoundingClientRect() : null;
      const report = {
        page,
        location: win.location.href,
        sidebarRect: sidebarRect ? {
          left: Math.round(sidebarRect.left),
          top: Math.round(sidebarRect.top),
          width: Math.round(sidebarRect.width),
          height: Math.round(sidebarRect.height)
        } : null,
        suiteLink: inspectLink(suiteLink, "suite"),
        tocLink: inspectLink(tocLink, "toc")
      };

      function finish() {
        result.textContent = JSON.stringify(report, null, 2);
      }

      function runTocTest() {
        const currentDoc = iframe.contentDocument;
        const currentWin = iframe.contentWindow;
        if (!currentDoc || !currentWin) {
          report.tocClick = { ok: false, reason: "iframe unavailable after suite click" };
          finish();
          return;
        }
        const tocTarget = currentDoc.querySelectorAll(".legal-toc-link")[1] || currentDoc.querySelector(".legal-toc-link");
        if (!(tocTarget instanceof currentWin.HTMLAnchorElement)) {
          report.tocClick = { ok: false, reason: "toc link not found" };
          finish();
          return;
        }
        const targetId = (tocTarget.getAttribute("href") || "").replace(/^#/, "");
        const targetSection = targetId ? currentDoc.getElementById(targetId) : null;
        const beforeScroll = Math.round(currentWin.scrollY);
        tocTarget.click();
        window.setTimeout(() => {
          report.tocClick = {
            ok: true,
            href: tocTarget.href,
            hash: currentWin.location.hash,
            beforeScroll,
            afterScroll: Math.round(currentWin.scrollY),
            targetFound: !!targetSection
          };
          finish();
        }, 700);
      }

      if (suiteLink instanceof win.HTMLAnchorElement) {
        const expectedHref = suiteLink.href;
        const onSecondLoad = () => {
          const nextWin = iframe.contentWindow;
          iframe.removeEventListener("load", onSecondLoad);
          report.suiteClick = {
            ok: !!nextWin,
            expectedHref,
            afterLocation: nextWin ? nextWin.location.href : null
          };
          runTocTest();
        };
        iframe.addEventListener("load", onSecondLoad);
        suiteLink.click();
        window.setTimeout(() => {
          if (!report.suiteClick) {
            iframe.removeEventListener("load", onSecondLoad);
            report.suiteClick = {
              ok: false,
              expectedHref,
              afterLocation: win.location.href
            };
            runTocTest();
          }
        }, 1200);
        return;
      }

      report.suiteClick = { ok: false, reason: "suite link not found" };
      runTocTest();
    }

    iframe.addEventListener("load", handleInitialLoad, { once: true });
  </script>
</body>
</html>
