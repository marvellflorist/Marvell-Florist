<script>
function getEmbeddedJsonPayload(scriptId) {
  const element = document.getElementById(scriptId);
  if (!(element instanceof HTMLScriptElement)) return null;
  const raw = String(element.textContent || "").trim();
  if (!raw) return null;
  try {
    return JSON.parse(raw);
  } catch (_error) {
    return null;
  }
}

function buildStoriesEndpoints() {
  const stamp = Date.now();
  return [
    `/content/stories.json?v=${stamp}`,
    `content/stories.json?v=${stamp}`,
    "/content/stories.json",
    "content/stories.json"
  ];
}

function normalizeStoryImage(entry) {
  if (!entry) return "";
  if (typeof entry === "string") return entry.trim();
  if (typeof entry === "object" && typeof entry.image === "string") return entry.image.trim();
  return "";
}

async function fetchStoriesPayload() {
  for (const endpoint of buildStoriesEndpoints()) {
    try {
      const response = await fetch(endpoint, { cache: "no-store" });
      if (!response.ok) continue;
      return await response.json();
    } catch (_error) {
    }
  }
  return getEmbeddedJsonPayload("embedded-stories-json");
}

function normalizeStoriesEntries(payload) {
  const pageTitle = String(payload?.pageTitle || "The Journals").trim() || "The Journals";
  const entries = Array.isArray(payload?.entries) ? payload.entries : [];
  return {
    pageTitle,
    entries: entries
      .map((entry, index) => {
        const slug = String(entry?.slug || "").trim() || `story-${index + 1}`;
        const title = String(entry?.title || "").trim() || `Journal ${index + 1}`;
        const monthYear = String(entry?.monthYear || "").trim();
        const coverImage = normalizeStoryImage(entry?.coverImage);
        const images = Array.isArray(entry?.images) ? entry.images.map(normalizeStoryImage).filter(Boolean) : [];
        return {
          slug,
          title,
          monthYear,
          coverImage: coverImage || images[0] || "",
          images
        };
      })
      .filter((entry) => entry.coverImage);
  };
}

function renderStoriesPage(data) {
  const titleNode = document.getElementById("stories-page-title");
  const grid = document.getElementById("stories-grid");
  const emptyState = document.getElementById("stories-empty");
  if (!(titleNode instanceof HTMLElement) || !(grid instanceof HTMLElement) || !(emptyState instanceof HTMLElement)) return;

  titleNode.textContent = data.pageTitle;
  document.title = `${data.pageTitle} | Marvell Florist`;
  if (!data.entries.length) {
    grid.classList.remove("stories-grid--single");
    emptyState.hidden = false;
    emptyState.style.display = "grid";
    grid.innerHTML = "";
    return;
  }

  grid.classList.toggle("stories-grid--single", data.entries.length === 1);
  emptyState.hidden = true;
  emptyState.style.display = "none";
  grid.innerHTML = data.entries.map((entry) => `
    <a class="story-card" href="journal.html?journal=${encodeURIComponent(entry.slug)}" aria-label="${entry.title}">
      <div class="story-card-media">
        <img src="${entry.coverImage}" alt="${entry.title}" loading="lazy" decoding="async">
      </div>
      <p class="story-card-title">${entry.title}</p>
      ${entry.monthYear ? `<p class="story-card-meta">${entry.monthYear}</p>` : ""}
    </a>
  `).join("");
}

(async () => {
  const payload = await fetchStoriesPayload();
  renderStoriesPage(normalizeStoriesEntries(payload || {}));
})();
</script>
