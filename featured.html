      margin: 8px 0 0;
      padding: 0;
      text-align: left;
      font-family: "Inter Tight", sans-serif;
      font-size: 12px;
      letter-spacing: 0.04em;

    .filters-trigger {

      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid rgba(42, 33, 24, 0.28);
      border-radius: 999px;
      background: transparent;
      padding: 8px 14px;
      color: rgba(42, 33, 24, 0.86);
      touch-action: manipulation;
      font-family: "Inter Tight", sans-serif;
      font-size: 12px;

    .filters-trigger .filters-trigger-icon,

      justify-content: center;
      width: 14px;
      height: 14px;
      flex: 0 0 auto;
    }

    .filters-trigger .filters-trigger-icon svg,
    .filters-trigger .filters-mobile-icon svg {
      width: 14px;
      height: 14px;
      display: block;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;

    .filters-trigger:hover,
    .filters-trigger:focus-visible {
      border-color: rgba(42, 33, 24, 0.86);
      box-shadow: inset 0 0 0 1px rgba(42, 33, 24, 0.86);
      outline: none;
    }

    .featured-filters-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(12, 10, 9, 0.34);

      -webkit-backdrop-filter: blur(0px);

    .featured-filters-backdrop.is-open {

      -webkit-backdrop-filter: blur(10px);
      pointer-events: auto;
    }

    .filters-panel-modal {
      position: fixed;
      top: auto;
      bottom: 0;
      right: 0;
      width: min(94vw, 620px);
      height: 100vh;
      background: #fff;
      color: #151210;
      transform: translateY(100%);
      transition: transform 0.5s ease-in-out;
      z-index: 251;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      box-shadow: none;
      border-top: 1px solid rgba(29, 26, 24, 0.08);
      border-left: 0;
    }

    .filters-panel-modal.is-open {

      box-shadow: 0 -20px 36px rgba(10, 12, 18, 0.18);
    }

    .filters-head {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: min(calc(100% - 40px), 408px);
      margin: 0 auto;
      padding: 52px 0 20px;

    .filters-head h3 {

      font-family: "Inter Tight", sans-serif;
      font-size: 22px;
      letter-spacing: 0.04em;
      text-transform: none;
      font-weight: 600;
      color: #151210;
    }

    .filters-close {
      position: absolute;
      top: 26px;
      right: 24px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 0;
      background: #151210;
      color: #fff;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .filters-close:hover,
    .filters-close:focus-visible {
      background: #2a2118;
      outline: none;
    }

    .filters-body {
      width: min(calc(100% - 40px), 432px);
      margin: 0 auto;
      padding: 10px 0 16px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .filters-footer {
      width: min(calc(100% - 40px), 432px);
      margin: 0 auto;
      padding: 8px 0 32px;
      box-sizing: border-box;
    }

    .filters-apply {
      width: 100%;
      min-height: 38px;
      border: 1px solid transparent;
      background: #12100e;
      color: #f8f4ec;
      display: inline-flex;
      pointer-events: auto;
      touch-action: manipulation;
      align-items: center;
      justify-content: center;
      font-family: "Inter Tight", sans-serif;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background-color 220ms ease, border-color 220ms ease, color 220ms ease;
    }

    .filters-apply.is-disabled,
    .filters-apply:disabled {
      background: rgba(47, 41, 35, 0.24);
      border-color: transparent;
      color: rgba(248, 244, 236, 0.72);
      cursor: not-allowed;
    }

    .filters-apply:not(:disabled):not(.is-disabled):hover,
    .filters-apply:not(:disabled):not(.is-disabled):focus-visible {
      outline: none;
      background: transparent;
      color: #151210;
      border-color: #151210;
    }

    .filters-panel {
      display: grid;
      gap: 10px;
      padding: 0;
    }

    .filter-group {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 0;
      border: 0;
      min-inline-size: 0;
    }

    .filter-group + .filter-group {
      border-top: 1px solid rgba(42, 33, 24, 0.14);
      margin-top: 16px;
      padding-top: 22px;
    }

    .filter-group-toggle {
      width: 100%;
      border: 0;
      background: none;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      touch-action: manipulation;
      margin: 0;
      font-family: "Inter Tight", sans-serif;
      font-size: 16px;
      letter-spacing: 0.04em;
      font-weight: 500;
      color: #151210;
      cursor: pointer;
    }

    .filter-group-toggle .filter-group-title {
      margin: 0;
    }

    .filter-group-icon {
      font-size: 18px;
      line-height: 1;
    }

    .filter-group-title {
      font-family: "Inter Tight", sans-serif;
      font-size: 16px;
      letter-spacing: 0.04em;
      text-transform: none;
      color: #151210;
    }

    .filter-group-panel {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      margin-top: 0;
      transition: max-height 0.32s ease, opacity 0.24s ease, margin-top 0.24s ease;
    }

    .filter-group.is-open .filter-group-panel {
      opacity: 1;
      margin-top: 10px;
    }

    .filter-options {
      display: grid;
      gap: 5px;
    }

    .filter-options--color {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      justify-content: start;
      gap: 18px 8px;
    }

    .filter-range {
      display: grid;
      gap: 12px;
      width: 100%;
      margin: 0;
      padding: 8px 8px 6px;
      box-sizing: border-box;
    }

    .filter-range-values {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      font-family: "Inter Tight", sans-serif;
      font-size: 12px;
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
      color: rgba(47, 41, 35, 0.82);
    }

    .filter-range-sliders {
      position: relative;
      height: 24px;
      margin: 0 6px;
    }

    .filter-range-track,
    .filter-range-fill {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      height: 0.75px;
      border-radius: 999px;
    }

    .filter-range-track {
      left: 0;
      right: 0;
      background: rgba(42, 33, 24, 0.12);
    }

    .filter-range-fill {
      left: 0;
      right: 0;
      background: #151210;
    }

    .filter-range-input {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 24px;
      margin: 0;
      background: none;
      -webkit-appearance: none;
      appearance: none;
      pointer-events: none;
    }

    .filter-range-input::-webkit-slider-runnable-track {
      height: 0.75px;
      background: transparent;
    }

    .filter-range-input::-moz-range-track {
      height: 0.75px;
      background: transparent;
      border: 0;
    }

    .filter-range-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1.25px solid #151210;
      background: #fff;
      box-shadow: none;
      pointer-events: auto;
      cursor: pointer;
      margin-top: -5.625px;
    }

    .filter-range-input::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1.25px solid #151210;
      background: #fff;
      box-shadow: none;
      pointer-events: auto;
      cursor: pointer;
    }

    .filter-range-note {
      margin: 0;
      font-family: "Inter Tight", sans-serif;
      font-size: 11px;
      line-height: 1.6;
      color: rgba(42, 33, 24, 0.56);
    }

    .filter-option {
      position: relative;
      display: block;
      width: 100%;
      touch-action: manipulation;
      cursor: pointer;
    }

    .filter-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .filter-option--color {
      width: 100%;
    }

    .filter-option-label {
      position: relative;
      display: block;
      width: 100%;
      min-height: 0;
      border-radius: 0;
      padding: 6px 0 6px 30px;
      border: 0;
      background: none;
      color: #151210;
      font-family: "Inter Tight", sans-serif;
      font-size: 13px;
      line-height: 1.45;
      transition: color 0.22s ease;
    }

    .filter-option-label::before {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: 1px solid rgba(42, 33, 24, 0.42);
      background: transparent;
      box-sizing: border-box;
      transition: background 0.22s ease, border-color 0.22s ease, border-width 0.22s ease;
    }

    .filter-option-label::after {
      content: "";
      position: absolute;
      left: 9px;
      top: 50%;
      width: 4px;
      height: 7px;
      border-right: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: translate(-50%, -58%) rotate(45deg);
      transform-origin: center;
      opacity: 0;
      transition: opacity 0.18s ease;
    }

    .filter-option input:checked + .filter-option-label {
      color: #2c231b;
    }

    .filter-option:hover .filter-option-label::before,
    .filter-option:focus-within .filter-option-label::before {
      border-width: 2px;
      border-color: #151210;
    }

    .filter-option input:checked + .filter-option-label::before {
      background: #1f1a15;
      border-color: #1f1a15;
    }

    .filter-option input:checked + .filter-option-label::after {
      opacity: 1;
    }

    .filter-option--color .filter-option-label {
      display: grid;
      grid-template-rows: auto auto;
      align-content: start;
      justify-items: stretch;
      gap: 14px;
      width: 100%;
      min-width: 0;
      min-height: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      overflow: visible;
      box-shadow: none;
    }

    .filter-option--color .filter-option-label::before,
    .filter-option--color .filter-option-label::after {
      content: none;
    }

    .filter-option--color input:checked + .filter-option-label {
      background: transparent;
      border-color: transparent;
      color: inherit;
    }

    .filter-color-swatch {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      border: 1px solid rgba(42, 33, 24, 0.12);
      background: var(--filter-swatch, #d7cfc2);
      border-radius: 0;
      box-shadow: none;
      transition: border-color 0.18s ease, transform 0.18s ease, background-color 0.18s ease;
    }

    .filter-option--color:hover .filter-color-swatch,
    .filter-option--color:focus-within .filter-color-swatch {
      transform: scale(0.976);
    }

    .filter-color-meta {
      display: grid;
      gap: 7px;
      min-height: 0;
    }

    .filter-color-text {
      display: block;
      text-align: left;
      color: rgba(42, 33, 24, 0.86);
      font-family: "Inter Tight", sans-serif;
      font-size: 12px;
      line-height: 1.3;
      flex: 1 1 auto;
    }

    .filter-color-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: auto;
      min-height: 24px;
      padding: 4px 10px;
      border: 1px solid rgba(88, 71, 56, 0.12);
      border-radius: 999px;
      background: rgba(250, 247, 242, 0.92);
      color: rgba(84, 64, 49, 0.72);
      font-family: "Inter Tight", sans-serif;
      font-size: 10px;
      line-height: 1.2;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-align: center;
      white-space: normal;
      box-shadow: none;
      justify-self: start;
    }

    .filter-option--color input:checked + .filter-option-label .filter-color-swatch {
      border-color: rgba(24, 19, 15, 0.78);
      box-shadow: inset 0 0 0 1px rgba(24, 19, 15, 0.78);
    }

    .filter-option--color input:checked + .filter-option-label .filter-color-text {
      color: #1f1a15;
    }

    .filter-option--color input:checked + .filter-option-label .filter-color-count {
      border-color: rgba(24, 19, 15, 0.24);
      color: rgba(24, 19, 15, 0.82);
    }

    .filter-option--color[data-color-id="white"] .filter-color-swatch {
      border-color: rgba(42, 33, 24, 0.22);
    }

    .filter-option--color[data-color-id="white"] input:checked + .filter-option-label .filter-color-swatch {
      border-color: rgba(24, 19, 15, 0.82);
      box-shadow: inset 0 0 0 1px rgba(24, 19, 15, 0.82);
    }

    .filter-actions {
      display: flex;
      justify-content: flex-start;
    }

    .filter-clear {
      border: 0;
      padding: 0;
      background: none;
      color: rgba(42, 33, 24, 0.7);
      font-family: "Inter Tight", sans-serif;
      font-size: 11px;
      letter-spacing: 0.08em;

    .filter-clear:hover,
    .filter-clear:focus-visible {
