<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tap Overlay Probe</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f1e8;
      --panel: #fffaf2;
      --ink: #1f1a17;
      --muted: #6d6257;
      --line: rgba(31, 26, 23, 0.14);
      --good: #17633d;
      --warn: #8a5b00;
      --bad: #8f1d1d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.45 "Inter Tight", system-ui, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #f6f1e8 0%, #efe5d8 100%);
    }
    main {
      width: min(1100px, calc(100% - 24px));
      margin: 0 auto;
      padding: 20px 0 36px;
      display: grid;
      gap: 16px;
    }
    .panel {
      background: rgba(255, 250, 242, 0.96);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 18px 40px rgba(31, 26, 23, 0.08);
    }
    h1, h2, p { margin: 0; }
    h1 { font-size: 22px; }
    h2 { font-size: 16px; margin-bottom: 10px; }
    .controls {
      display: grid;
      gap: 10px;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: end;
    }
    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    input, button {
      font: inherit;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      min-height: 44px;
      padding: 10px 12px;
    }
    button {
      cursor: pointer;
      font-weight: 600;
    }
    .layout {
      display: grid;
      gap: 16px;
      grid-template-columns: minmax(0, 400px) minmax(0, 1fr);
      align-items: start;
    }
    #report {
      display: grid;
      gap: 12px;
      max-height: calc(100vh - 180px);
      overflow: auto;
      padding-right: 4px;
    }
    .probe-card {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      background: #fff;
      display: grid;
      gap: 8px;
    }
    .probe-card.good { border-color: rgba(23, 99, 61, 0.3); }
    .probe-card.warn { border-color: rgba(138, 91, 0, 0.3); }
    .probe-card.bad { border-color: rgba(143, 29, 29, 0.3); }
    .status {
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .good .status { color: var(--good); }
    .warn .status { color: var(--warn); }
    .bad .status { color: var(--bad); }
    .meta {
      color: var(--muted);
      font-size: 12px;
      word-break: break-word;
    }
    code {
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      background: rgba(31, 26, 23, 0.05);
      padding: 1px 4px;
      border-radius: 5px;
    }
    .stack {
      display: grid;
      gap: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
    }
    .viewport {
      background: #d9d0c4;
      padding: 12px;
      border-radius: 20px;
      border: 1px solid rgba(31, 26, 23, 0.08);
      display: flex;
      justify-content: center;
      position: sticky;
      top: 16px;
    }
    iframe {
      width: 390px;
      height: 844px;
      border: 0;
      background: white;
      border-radius: 22px;
      box-shadow: 0 22px 46px rgba(20, 18, 16, 0.18);
    }
    .summary {
      display: grid;
      gap: 6px;
      color: var(--muted);
    }
    @media (max-width: 920px) {
      .controls,
      .layout {
        grid-template-columns: 1fr;
      }
      #report {
        max-height: none;
      }
      .viewport {
        position: static;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <h1>Tap Overlay Probe</h1>
      <p class="summary">Loads a page in a mobile-sized iframe and checks which elements actually sit on top of visible links.</p>
    </section>

    <section class="panel controls">
      <label>
        Page
        <input id="page-input" type="text" value="index.html">
      </label>
      <button id="load-btn" type="button">Load Page</button>
      <button id="rerun-btn" type="button">Run Probe</button>
    </section>

    <section class="layout">
      <div id="report" class="panel" aria-live="polite"></div>
      <div class="viewport">
        <iframe id="probe-frame" title="Probe frame" loading="eager"></iframe>
      </div>
    </section>
  </main>

  <script>
    const pageInput = document.getElementById("page-input");
    const loadButton = document.getElementById("load-btn");
    const rerunButton = document.getElementById("rerun-btn");
    const report = document.getElementById("report");
    const frame = document.getElementById("probe-frame");

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function describeElement(node) {
      if (!(node instanceof Element)) return "(none)";
      const id = node.id ? `#${node.id}` : "";
      const className = typeof node.className === "string"
        ? `.${node.className.trim().split(/\s+/).filter(Boolean).slice(0, 3).join(".")}`
        : "";
      return `${node.tagName.toLowerCase()}${id}${className}`;
    }

    function findCandidateAnchors(doc) {
      return Array.from(doc.querySelectorAll("a[href]")).filter((anchor) => {
        if (!(anchor instanceof HTMLAnchorElement)) return false;
        const href = (anchor.getAttribute("href") || "").trim();
        if (!href || href === "#" || /^javascript:/i.test(href)) return false;
        const rect = anchor.getBoundingClientRect();
        const style = doc.defaultView.getComputedStyle(anchor);
        if (rect.width < 8 || rect.height < 8) return false;
        if (style.visibility === "hidden" || style.display === "none" || style.pointerEvents === "none") return false;
        if (rect.bottom < 0 || rect.top > doc.defaultView.innerHeight) return false;
        return true;
      }).slice(0, 14);
    }

    function inspectAnchor(anchor, win) {
      const rect = anchor.getBoundingClientRect();
      const centerX = Math.min(win.innerWidth - 1, Math.max(1, rect.left + (rect.width / 2)));
      const centerY = Math.min(win.innerHeight - 1, Math.max(1, rect.top + (rect.height / 2)));
      const stack = Array.from(win.document.elementsFromPoint(centerX, centerY));
      const top = stack[0] || null;
      const topMatches = !!top && (top === anchor || anchor.contains(top) || top.contains(anchor));
      const chain = [];
      let current = anchor;
      while (current && current instanceof Element && chain.length < 8) {
        const style = win.getComputedStyle(current);
        chain.push({
          node: describeElement(current),
          pointerEvents: style.pointerEvents,
          position: style.position,
          zIndex: style.zIndex,
          opacity: style.opacity
        });
        current = current.parentElement;
      }

      const problematicOverlay = stack.find((node) => {
        if (!(node instanceof Element) || node === anchor || anchor.contains(node) || node.contains(anchor)) return false;
        const style = win.getComputedStyle(node);
        if (style.pointerEvents === "none") return false;
        if (style.visibility === "hidden" || style.display === "none") return false;
        return ["fixed", "sticky", "absolute"].includes(style.position);
      });

      return {
        text: (anchor.textContent || anchor.getAttribute("aria-label") || "").trim().replace(/\s+/g, " ").slice(0, 100),
        href: anchor.getAttribute("href") || "",
        rect: {
          x: Math.round(rect.left),
          y: Math.round(rect.top),
          w: Math.round(rect.width),
          h: Math.round(rect.height)
        },
        center: { x: Math.round(centerX), y: Math.round(centerY) },
        top: describeElement(top),
        topMatches,
        problematicOverlay: describeElement(problematicOverlay),
        stack: stack.slice(0, 6).map((node) => {
          if (!(node instanceof Element)) return "(none)";
          const style = win.getComputedStyle(node);
          return `${describeElement(node)} [pos:${style.position}; pe:${style.pointerEvents}; z:${style.zIndex}]`;
        }),
        chain
      };
    }

    function renderResults(results, page) {
      const blocked = results.filter((item) => !item.topMatches);
      report.innerHTML = `
        <div class="probe-card ${blocked.length ? "warn" : "good"}">
          <div class="status">${blocked.length ? "Potential Overlays Found" : "No Overlay Hits Found"}</div>
          <div class="meta">Page: <code>${escapeHtml(page)}</code></div>
          <div class="meta">Visible links checked: <code>${results.length}</code></div>
          <div class="meta">Links whose center point is covered by another element: <code>${blocked.length}</code></div>
        </div>
        ${results.map((item) => {
          const level = item.topMatches ? "good" : "bad";
          return `
            <div class="probe-card ${level}">
              <div class="status">${item.topMatches ? "Top Hit Is Link" : "Covered At Tap Point"}</div>
              <div><strong>${escapeHtml(item.text || "(untitled link)")}</strong></div>
              <div class="meta">Href: <code>${escapeHtml(item.href)}</code></div>
              <div class="meta">Rect: <code>${item.rect.x}, ${item.rect.y}, ${item.rect.w}x${item.rect.h}</code> | Center: <code>${item.center.x}, ${item.center.y}</code></div>
              <div class="meta">Top element: <code>${escapeHtml(item.top)}</code></div>
              ${!item.topMatches ? `<div class="meta">Overlay suspect: <code>${escapeHtml(item.problematicOverlay)}</code></div>` : ""}
              <div class="stack">${item.stack.map((entry) => `<div>${escapeHtml(entry)}</div>`).join("")}</div>
            </div>
          `;
        }).join("")}
      `;
    }

    function runProbe(attempt = 0) {
      try {
        const win = frame.contentWindow;
        const doc = frame.contentDocument;
        if (!win || !doc) {
          if (attempt < 10) {
            window.setTimeout(() => runProbe(attempt + 1), 500);
            return;
          }
          report.innerHTML = '<div class="probe-card bad"><div class="status">Frame Not Ready</div></div>';
          return;
        }
        const anchors = findCandidateAnchors(doc);
        if (!anchors.length && attempt < 12) {
          window.setTimeout(() => runProbe(attempt + 1), 700);
          return;
        }
        const results = anchors.map((anchor) => inspectAnchor(anchor, win));
        renderResults(results, pageInput.value.trim());
      } catch (error) {
        report.innerHTML = `<div class="probe-card bad"><div class="status">Probe Error</div><div class="meta"><code>${escapeHtml(error && error.message ? error.message : String(error))}</code></div></div>`;
      }
    }

    function loadPage() {
      const params = new URLSearchParams(window.location.search);
      const rawPage = (pageInput.value || params.get("page") || "index.html").trim();
      const nextPage = rawPage || "index.html";
      pageInput.value = nextPage;
      frame.src = nextPage;
    }

    frame.addEventListener("load", () => {
      window.setTimeout(() => runProbe(0), 1200);
    });
    loadButton.addEventListener("click", loadPage);
    rerunButton.addEventListener("click", runProbe);

    const initialPage = new URLSearchParams(window.location.search).get("page");
    if (initialPage) pageInput.value = initialPage;
    loadPage();
  </script>
</body>
</html>
