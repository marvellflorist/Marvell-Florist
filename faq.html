  <style>
    @font-face {
      font-family: "Relationship of Melodrame";
      src: url("assets/fonts/relationship-of-melodrame.woff2?v=2") format("woff2"),
           url("assets/fonts/relationship-of-melodrame.ttf?v=2") format("truetype");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }
    :root {
      --bg: #f8f6f1;
      --ink: #2f2923;
      --muted: rgba(47, 41, 35, 0.74);
      --line: rgba(63, 54, 45, 0.16);
    }
    * { box-sizing: border-box; }
    html {
      background: var(--bg);
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Fraunces", serif;
    }
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10;
      height: 72px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      pointer-events: none;
    }
    header::before {
      content: "";
      position: fixed;
      inset: 0 0 auto;
      height: 72px;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      z-index: 1;
    }
    .header-bar {
      position: relative;
      width: 100%;
      height: 72px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 2;
      pointer-events: auto;
    }
    .header-logo {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      text-decoration: none;
    }
    .header-logo-text {
      display: inline-block;
      font-family: "Imperial Script", cursive;
      font-size: 32px;
      line-height: 0.9;
      letter-spacing: 0.01em;
      color: rgba(42, 33, 24, 0.82);
    }
    .header-contact,
    .search-toggle,
    .menu-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--ink);
      font-family: "Inter Tight", sans-serif;
      font-size: 12px;
      letter-spacing: 0.06em;
    }
    .header-contact::before {
      content: "+";
      margin-right: 8px;
      font-size: 14px;
      line-height: 1;
      transform: translateY(-0.5px);
    }
    .search-toggle {
      margin-left: auto;
    }
    .search-toggle svg {
      width: 18px;
      height: 18px;
      display: block;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .menu-toggle {
      gap: 10px;
    }
    .menu-icon {
      display: inline-flex;
      flex-direction: column;
      gap: 4px;
    }
    .menu-icon span {
      width: 18px;
      height: 2px;
      background: rgba(42, 33, 24, 0.72);
      display: block;
    }
    main {
      width: min(960px, 92vw);
      margin: 0 auto;
      padding: 106px 0 64px;
      display: grid;
      gap: 18px;
    }
    h1 {
      margin: 0;
      font-family: "Relationship of Melodrame", "Imperial Script", cursive;
      font-size: clamp(42px, 8vw, 74px);
      line-height: 0.9;
      font-weight: 400;
    }
    .lead {
      margin: 0;
      font-size: clamp(16px, 2vw, 19px);
      line-height: 1.72;
      color: var(--muted);
      max-width: 70ch;
    }
    .faq-wrap {
      margin-top: 4px;
      border-top: 1px solid var(--line);
      background: transparent;
    }
    .faq-item {
      border-bottom: 1px solid var(--line);
    }
    .faq-item:last-child {
      border-bottom: 0;
    }
    .faq-toggle {
      width: 100%;
      border: 0;
      background: none;
      padding: 19px 2px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-align: left;
      cursor: pointer;
      font-family: "Inter Tight", sans-serif;
      font-size: 15px;
      letter-spacing: 0.01em;
      line-height: 1.35;
      color: rgba(42, 33, 24, 0.94);
      font-weight: 600;
    }
    .faq-icon {
      font-size: 18px;
      line-height: 1;
      color: rgba(42, 33, 24, 0.66);
      transition: transform 0.24s ease;
      flex: 0 0 auto;
    }
    .faq-panel {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 320ms ease, opacity 220ms ease;
    }
    .faq-item.is-open .faq-panel {
      opacity: 1;
    }
    .faq-item.is-open .faq-icon {
      transform: rotate(45deg);
    }
    .faq-content {
      padding: 0 2px 22px;
      font-family: "Fraunces", serif;
      font-size: clamp(16px, 2vw, 18px);
      line-height: 1.72;
      color: var(--muted);
      margin: 0;
    }
    @media (max-width: 768px) {
      header {
        height: 62px;
        padding: 0 14px;
      }
      header::before,
      .header-bar {
        height: 62px;
      }
      .header-logo-text {
        font-size: 28px;
      }
      .header-contact {
        display: none;
      }
      .search-toggle,
      .menu-toggle {
        gap: 0;
      }
      .search-toggle .search-label,
      .menu-toggle .menu-label {
        display: none;
      }
      main {
        padding-top: 92px;
      }
    }
</style>
<style>
.search-toggle { display: none !important; }
.menu-toggle { margin-left: auto !important; }

<body>
  <header>
    <div class="header-bar">
      <a class="header-contact" href="https://wa.me/6281275017456" target="_blank" rel="noopener noreferrer">Hubungi Kami</a>
      <a class="header-logo" href="index.html#home" aria-label="Go to home page">
        <span class="header-logo-text">Marvell Florist</span>
      </a>
      <a class="search-toggle" href="index.html?search" aria-label="Open search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="16.65" y1="16.65" x2="21" y2="21"></line></svg>
        <span class="search-label">Cari</span>
      </a>

        <span class="menu-icon" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="menu-label">Menu</span>
      </a>
    </div>
  </header>
  <main>
    <h1>Pertanyaan yang Sering Diajukan</h1>
    <p class="lead">Temukan jawaban singkat untuk pertanyaan yang paling sering diajukan sebelum melakukan pemesanan.</p>
    <section class="faq-wrap" id="faq-wrap" aria-label="Frequently asked questions"></section>
  </main>

  <script>
    const FAQ_ITEMS = [
      {
        question: "Bagaimana cara melakukan pemesanan?",
        answer: "Seluruh pesanan dilakukan melalui konsultasi. Anda dapat menghubungi kami melalui WhatsApp untuk mendiskusikan kebutuhan, preferensi desain, serta detail pesanan Anda."
      },
      {
        question: "Mengapa sebagian produk tidak memiliki harga tetap?",
        answer: "Sebagian besar rangkaian kami dibuat secara khusus. Harga akhir akan disesuaikan dengan pilihan bunga, ukuran, serta tingkat kompleksitas desain."
      },
      {
        question: "Apakah tersedia daftar harga bunga segar?",
        answer: "Ya, kami menyediakan daftar harga untuk bunga potong segar. Namun, ketersediaan dan harga dapat berubah mengikuti kondisi pasar dan stok."
      },
      {
        question: "Apakah semua produk selalu tersedia?",
        answer: "Ketersediaan bunga dan rangkaian dapat berbeda tergantung musim dan stok. Kami menyarankan untuk melakukan konfirmasi terlebih dahulu sebelum melakukan pemesanan."
      },
      {
        question: "Apakah saya dapat memesan desain khusus?",
        answer: "Tentu. Kami menerima pesanan khusus yang dirancang sesuai dengan kebutuhan, tema, dan momen yang ingin Anda rayakan."
      },
      {
        question: "Apakah tersedia layanan pengiriman?",
        answer: "Kami menyediakan layanan pengiriman untuk area Batam. Biaya pengiriman akan disesuaikan dengan lokasi tujuan."
      },
      {
        question: "Apakah memungkinkan untuk pemesanan di hari yang sama?",
        answer: "Pemesanan di hari yang sama dapat dilakukan tergantung pada ketersediaan dan kompleksitas pesanan. Silakan hubungi kami untuk konfirmasi lebih lanjut."
      },
      {
        question: "Metode pembayaran apa yang tersedia?",
        answer: "Kami menerima pembayaran melalui transfer bank, tunai, serta metode pembayaran lain yang tersedia."
      },
      {
        question: "Kapan pesanan saya dianggap selesai dikonfirmasi?",
        answer: "Pesanan akan diproses setelah detail desain disepakati dan pembayaran telah diterima."
      },
      {
        question: "Apakah pesanan dapat diubah atau dibatalkan?",
        answer: "Perubahan atau pembatalan dapat dilakukan selama pesanan belum memasuki tahap produksi. Silakan hubungi kami sesegera mungkin untuk bantuan lebih lanjut."
      }
    ];

    const faqWrap = document.getElementById("faq-wrap");
    if (faqWrap) {
      faqWrap.innerHTML = FAQ_ITEMS.map((item) => `
        <article class="faq-item">
          <button class="faq-toggle" type="button" aria-expanded="false">
            <strong>${item.question}</strong>
            <span class="faq-icon" aria-hidden="true">+</span>
          </button>
          <div class="faq-panel">
            <p class="faq-content">${item.answer}</p>
          </div>
        </article>
      `).join("");

      const items = Array.from(faqWrap.querySelectorAll(".faq-item"));
      items.forEach((item) => {
        const toggle = item.querySelector(".faq-toggle");
        const panel = item.querySelector(".faq-panel");
        if (!(toggle instanceof HTMLButtonElement) || !(panel instanceof HTMLElement)) return;

        toggle.addEventListener("click", () => {
          const shouldOpen = !item.classList.contains("is-open");
          items.forEach((other) => {
            const otherToggle = other.querySelector(".faq-toggle");
            const otherPanel = other.querySelector(".faq-panel");
            if (otherToggle instanceof HTMLButtonElement) otherToggle.setAttribute("aria-expanded", "false");
            if (otherPanel instanceof HTMLElement) otherPanel.style.maxHeight = "0px";
            other.classList.remove("is-open");
          });

          if (!shouldOpen) return;
          item.classList.add("is-open");
          toggle.setAttribute("aria-expanded", "true");
          panel.style.maxHeight = `${panel.scrollHeight}px`;
        });
      });
    }
  </script>
</body>
