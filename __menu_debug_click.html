<!doctype html>
<html>
<body>
<iframe id="f" style="width:1440px;height:1400px;border:0"></iframe>
<pre id="out"></pre>
<script>
const params = new URLSearchParams(location.search);
const target = params.get("target");
const iframe = document.getElementById("f");
const out = document.getElementById("out");
iframe.src = target;
iframe.onload = () => {
  const doc = iframe.contentDocument;
  const q = (s) => doc.querySelector(s);
  const menuToggle = q("#menu-toggle") || q(".menu-toggle");
  const panel = q("#menu-panel");
  const services = q('[data-menu-open="services"]');
  const report = (phase) => {
    out.textContent += JSON.stringify({
      phase,
      hasMenuToggle: !!menuToggle,
      hasPanel: !!panel,
      panelOpen: panel ? panel.classList.contains("is-open") : null,
      menuCurrent: panel ? panel.getAttribute("data-menu-current") : null,
      quickActive: panel ? panel.getAttribute("data-menu-quick-active") : null,
      quickCurrent: q("[data-menu-quickpane]") ? q("[data-menu-quickpane]").getAttribute("data-quick-current") : null,
      hasServices: !!services,
      servicesExpanded: services ? services.getAttribute("aria-expanded") : null
    }, null, 2) + "\n---\n";
  };
  report("loaded");
  if (menuToggle) menuToggle.click();
  setTimeout(() => {
    report("after-menu-click");
    if (services) services.click();
    setTimeout(() => {
      report("after-services-click");
    }, 700);
  }, 700);
};
</script>
</body>
</html>
